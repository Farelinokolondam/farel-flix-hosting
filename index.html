<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FARELFLIX-tambala</title>
<style>
body{margin:0;background:#141414;color:#fff;font-family:Arial}
header{background:#000;padding:12px 15px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:2px solid #222}
.nav-menu{display:flex;gap:8px;align-items:center}
.nav-menu button{background:#222;color:#fff;border:1px solid #333;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.nav-menu button.active{background:#ff8c00;color:#000;font-weight:bold}
#searchBox{background:#222;color:#fff;border:1px solid #444;padding:8px 14px;border-radius:20px;width:200px;outline:none}
#semuaKategori{padding:15px}.kategori{margin-bottom:25px}.kategori h2{color:#ff8c00}
.row{display:flex;gap:12px;overflow-x:auto}.card{background:#222;border-radius:8px;min-width:140px;cursor:pointer;padding:5px}.card img{width:140px;height:210px;object-fit:cover;border-radius:5px}.card p{font-size:12px;text-align:center}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;justify-content:center;align-items:center;z-index:999}.modal-box{background:#222;padding:20px;border-radius:10px;text-align:center}
#myVideo,#myIframe{width:100%;height:75vh;border:none;background:#000}
.no-result{text-align:center;color:#777;margin-top:50px;display:none}
</style></head><body>
<header>
<span onclick="goHome()" style="color:#ff0000;font-size:22px;font-weight:bold;cursor:pointer">FARELFLIX-tambala</span>
<div class="nav-menu">
<button id="btn-home" class="active" onclick="filterKategori('all')">Home</button>
<button id="btn-action" onclick="filterKategori('ACTION')">Action</button>
<button id="btn-terbaru" onclick="filterKategori('TERBARU')">Terbaru</button>
<input id="searchBox" type="text" placeholder="Cari film..." onkeyup="cariFilm()">
</div>
<div><span id="userEmail" style="font-size:11px"></span><button onclick="logout()" style="background:#e50914;color:#fff;border:none;padding:6px 10px;border-radius:5px">Logout</button></div>
</header>
<div id="semuaKategori"></div><div id="noResult" class="no-result">Film tidak ditemukan</div>
<div id="modalBayar" class="modal"><div class="modal-box"><h3 id="judulBayar"></h3><button onclick="playFilm()">BAYAR & TONTON</button><button onclick="tutupModal()">BATAL</button></div></div>
<div id="modalPlayer" class="modal"><div style="width:100%;text-align:center"><h3 id="judulPlayer"></h3><video id="myVideo" controls></video><iframe id="myIframe" allowfullscreen></iframe><br><button onclick="tutupPlayer()">TUTUP</button></div></div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const loading = {style:{display:"none"}}; // dummy biar gak error
onAuthStateChanged(auth, (user) => {
  if(!user){ window.location.href="login.html"; }
  else { document.getElementById("userEmail").innerText=user.email; document.getElementById("semuaKategori").style.display="block"; renderFilm(dataFilm); }
});
window.logout = ()=>{ signOut(auth).then(()=>{ window.location.href="login.html"; }); }
</script>
<script>
const dataFilm={"ACTION":[{judul:"DIE HARD",file:"https://drive.google.com/file/d/15HSk3mEn9UDUP372LikPRNNod3W1oRsR/preview",type:"drive",gambar:"gambar/diehard2023.jpg"},{judul:"JOHN WICK 3",file:"https://drive.google.com/file/d/1LP1fanmcoKYm5wQaD4zLnxXwm4rLh41V/preview",type:"drive",gambar:"gambar/John_Wick_Chapter_3_Parabellum.png"}],"TERBARU":[{judul:"JOHN WICK 4",file:"https://streamtape.com/e/160ZVwLZM9FdZ1",type:"streamtape",gambar:"gambar/johnwick4.webp"}]};
let aktifFile="",aktifType=""; const container=document.getElementById("semuaKategori");
function renderFilm(data){ container.innerHTML=""; let ada=false; for(let kat in data){ if(!data[kat].length) continue; ada=true; let html=`<div class="kategori"><h2>${kat}</h2><div class="row">`; data[kat].forEach(f=>{html+=`<div class="card" onclick="buka('${f.judul}','${f.file}','${f.type}')"><img src="${f.gambar}" onerror="this.src='https://via.placeholder.com/140x210?text=No+Image'"><p>${f.judul}</p></div>`;}); html+=`</div></div>`; container.innerHTML+=html; } document.getElementById("noResult").style.display=ada?"none":"block"; }
function goHome(){ document.getElementById("searchBox").value=""; document.querySelectorAll('.nav-menu button').forEach(b=>b.classList.remove('active')); document.getElementById("btn-home").classList.add('active'); renderFilm(dataFilm); }
function filterKategori(kat){ document.getElementById("searchBox").value=""; document.querySelectorAll('.nav-menu button').forEach(b=>b.classList.remove('active')); document.getElementById("btn-"+kat.toLowerCase()).classList.add('active'); if(kat==='all'){renderFilm(dataFilm);return;} let f={}; f[kat]=dataFilm[kat]; renderFilm(f); }
function cariFilm(){ let q=document.getElementById("searchBox").value.toLowerCase(); if(!q){goHome();return;} let h={}; for(let k in dataFilm){ let c=dataFilm[k].filter(f=>f.judul.toLowerCase().includes(q)); if(c.length) h[k]=c; } renderFilm(h); }
function buka(j,f,t){aktifFile=f;aktifType=t;document.getElementById("judulBayar").innerText=j;document.getElementById("judulPlayer").innerText=j;document.getElementById("modalBayar").style.display="flex";}
function tutup(id){document.getElementById(id).style.display="none";} function tutupModal(){tutup('modalBayar');}
function playFilm(){tutup('modalBayar');document.getElementById("modalPlayer").style.display="flex";let v=document.getElementById("myVideo");let i=document.getElementById("myIframe");if(aktifType=="drive"||aktifType=="streamtape"){v.style.display="none";v.pause();i.style.display="block";i.src=aktifFile;}else{i.style.display="none";v.style.display="block";v.src=aktifFile;v.play();}}
function tutupPlayer(){tutup('modalPlayer');let v=document.getElementById("myVideo");v.pause();v.src="";let i=document.getElementById("myIframe");i.src="";i.style.display="none";}
</script></body></html>
