<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX - Cepat</title>
<link rel="preconnect" href="https://image.tmdb.org">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Arial}
.top-bar{background:#1e3a8a;padding:10px 15px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.top-logo{font-size:24px;font-weight:900;color:#facc15}.top-logo span{color:#fff}
.top-search{flex:1}.top-search input{width:100%;padding:8px 12px;border-radius:20px;border:none;background:#000;color:#fff;font-size:12px}
.mid-bar{background:#dc2626;padding:8px 15px;display:flex;gap:15px;font-size:12px;font-weight:700;overflow-x:auto;white-space:nowrap}
.mid-bar a{color:#fff;text-decoration:none}
.bot-bar{background:#facc15;padding:6px 15px;display:flex;gap:14px;font-size:10px;font-weight:900;overflow-x:auto;white-space:nowrap;color:#000}
.bot-bar a{color:#000;text-decoration:none}
.container{padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.card{background:#161616;border-radius:5px;overflow:hidden;cursor:pointer;border:1px solid #222}
.card img{width:100%;height:160px;object-fit:cover;background:#222;display:block}
.card-info{padding:6px}.card-title{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:8px;background:#e50914;padding:2px 4px;border-radius:3px;margin-top:3px;display:inline-block}

/* MODAL CEPAT */
.modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center}
.modal.show{display:flex}
.box-player{width:100%;max-width:800px;background:#000;border-radius:6px;overflow:hidden}
#myVideo{width:100%;height:450px;background:#000}
@media(max-width:768px){#myVideo{height:220px}.grid{grid-template-columns:repeat(3,1fr)}.card img{height:140px}}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-logo">FAREL<span>FLIX</span></div>
  <div class="top-search"><input id="searchInput" placeholder="Cari John Wick, Die Hard..."></div>
  <a id="logoutBtn" style="background:#e50914;padding:5px 10px;border-radius:4px;font-size:11px;cursor:pointer">Logout</a>
</div>
<div class="mid-bar"><a>🏠 Home</a><a>Populer</a><a>Genre</a></div>
<div class="bot-bar"><a onclick="filterQ('john')">JOHN WICK</a><a onclick="filterQ('die')">DIE HARD</a><a>ACTION</a><a>HORROR</a><a>BLURAY</a></div>

<div class="container"><div class="grid" id="movieGrid"></div></div>

<div id="modalBayar" class="modal"><div style="background:#111;padding:20px;border-radius:8px;width:320px;text-align:center;border-top:4px solid #e50914"><h4 id="JudulBayar"></h4><button onclick="playFilm()" style="width:100%;margin-top:15px;padding:10px;background:#e50914;color:#fff;border:none;border-radius:4px;font-weight:bold">▶ PLAY SEKARANG</button><button onclick="tutup('modalBayar')" style="width:100%;margin-top:8px;padding:8px;background:#222;color:#fff;border:none;border-radius:4px">Batal</button></div></div>

<div id="modalPlayer" class="modal"><div class="box-player"><div style="padding:10px;background:#111;display:flex;justify-content:space-between"><span id="judulPlayer" style="font-size:12px"></span><button onclick="tutupPlayer()" style="background:#e50914;color:#fff;border:none;padding:5px 10px;border-radius:4px">X</button></div><video id="myVideo" controls preload="metadata" playsinline></video></div></div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(!u) location.href="login.html";});
document.getElementById("logoutBtn").onclick=async()=>{if(confirm("Mau keluar ya atau tidak?")){await signOut(auth);location.href="login.html";}};
</script>

<script>
// FILM LANGSUNG TAMPIL - GAK NUNGGU API!
let aktifFile="", allFilms=[
 {judul:"JOHN WICK", file:"videos/john-wick.mp4", img:"https://image.tmdb.org/t/p/w200/fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg"},
 {judul:"JOHN WICK CHAPTER 4", file:"videos/john-wick-4.mp4", img:"https://image.tmdb.org/t/p/w200/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"},
 {judul:"DIE HARD", file:"videos/die-hard.mp4", img:"https://image.tmdb.org/t/p/w200/yF43yaRu2I2r2Z8m6u3d3.jpg"},
 {judul:"DIE HARD 4", file:"videos/die-hard-4.mp4", img:"https://image.tmdb.org/t/p/w200/a8p4g4.jpg"},
 {judul:"ACTION 2026", file:"videos/action.mp4", img:"https://via.placeholder.com/200x300/111/facc15?text=ACTION"},
 {judul:"BLURAY NEW", file:"videos/new.mp4", img:"https://via.placeholder.com/200x300/111/e50914?text=BLURAY"}
];

const grid=document.getElementById("movieGrid");
function render(list){
 grid.innerHTML="";
 list.forEach(f=>{
  // pakai w200 biar kecil & cepat, bukan w500
  grid.innerHTML+=`<div class="card" onclick="buka('${f.judul}','${f.file}')"><img loading="lazy" src="${f.img}" alt="${f.judul}"><div class="card-info"><div class="card-title">${f.judul}</div><span class="badge">PLAY</span></div></div>`;
 });
}

// TAMPILKAN LANGSUNG - 0 DETIK!
render(allFilms);

function buka(j,f){aktifFile=f;document.getElementById("JudulBayar").innerText=j;document.getElementById("judulPlayer").innerText=j;document.getElementById("modalBayar").style.display="flex";}
function tutup(id){document.getElementById(id).style.display="none";}
function playFilm(){
 tutup('modalBayar');
 document.getElementById("modalPlayer").classList.add("show");
 let v=document.getElementById("myVideo");
 v.src=aktifFile;
 v.load(); // load cepat
 v.play().catch(()=>{});
}
function tutupPlayer(){
 document.getElementById("modalPlayer").classList.remove("show");
 let v=document.getElementById("myVideo");
 v.pause(); v.removeAttribute('src'); v.load();
}
function filterQ(q){render(allFilms.filter(x=>x.judul.toLowerCase().includes(q.toLowerCase())));}
document.getElementById("searchInput").addEventListener("input",e=>{filterQ(e.target.value);});
</script>
</body>
</html>
