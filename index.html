<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX-tambala</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e0e;color:#fff;font-family:Arial}
.header{background:#000;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.logo{color:#ff3c00;font-weight:900;font-size:20px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{background:#2a2a2a;color:#fff;border:1px solid #333;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:12px}
.nav button.active{background:#facc15!important;color:#000!important;border-color:#facc15!important}
#searchBox{padding:6px 12px;border-radius:20px;border:none;background:#222;color:#fff;width:140px;font-size:12px}
.top-right{display:flex;align-items:center;gap:10px;font-size:11px}
#logoutBtn{background:#e50914;padding:6px 10px;border-radius:4px;cursor:pointer;font-weight:bold}
.container{padding:15px}
.judul{color:#ff8c00;font-weight:900;margin:15px 0 10px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.card{background:#1a1a1a;border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid #222}
.card img{width:100%;height:160px;object-fit:cover;display:block;background:#222}
.card-title{padding:6px;font-size:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:999;padding:15px}
.modal.show{display:flex}
.box{background:#111;padding:20px;border-radius:8px;width:320px;text-align:center;border-top:4px solid #e50914}
.box button{width:100%;padding:10px;margin-top:8px;border:none;border-radius:4px;font-weight:bold;cursor:pointer}
.box-player{width:100%;max-width:800px;background:#000;border-radius:8px;overflow:hidden}
#myVideo{width:100%;height:450px;background:#000}
@media(max-width:600px){#myVideo{height:220px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">FARELFLIX-tambala</div>
  <div class="nav">
    <button id="btn-home" class="active" onclick="filterKategori('all')">Home</button>
    <button id="btn-action" onclick="filterKategori('action')">Action</button>
    <button id="btn-terbaru" onclick="filterKategori('terbaru')">Terbaru</button>
    <input type="text" id="searchBox" placeholder="Cari film..." oninput="cariFilm()">
  </div>
  <div class="top-right">
    <span id="userEmail">fareline...@gmail.com</span>
    <span id="logoutBtn">Logout</span>
  </div>
</div>

<div class="container">
  <div class="judul">TERBARU</div>
  <div class="grid" id="movieGrid"></div>
</div>

<div id="modalBayar" class="modal"><div class="box"><h4 id="JudulBayar"></h4><button onclick="playFilm()" style="background:#e50914;color:#fff">▶ Play Sekarang</button><button onclick="tutup('modalBayar')" style="background:#2a2a2a;color:#fff">Batal</button></div></div>
<div id="modalPlayer" class="modal"><div class="box-player"><div style="padding:10px;background:#111;display:flex;justify-content:space-between"><span id="judulPlayer"></span><button onclick="tutupPlayer()" style="background:#e50914;color:#fff;padding:5px 10px">X Tutup</button></div><video id="myVideo" controls preload="metadata" playsinline></video></div></div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(!u) location.href="login.html"; else document.getElementById("userEmail").innerText=u.email;});
document.getElementById("logoutBtn").onclick=async()=>{await signOut(auth);location.href="login.html";};
</script>

<script>
// === CODE ASLI KAMU - YANG DI FOTO ===
let aktifFile="", aktifType="";
const dataFilm={
  terbaru:[
    {judul:"JOHN WICK 4", file:"videos/john-wick-4.mp4", img:"https://image.tmdb.org/t/p/w200/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg", tipe:"mp4"},
    {judul:"JOHN WICK", file:"videos/john-wick.mp4", img:"https://image.tmdb.org/t/p/w200/fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg", tipe:"mp4"},
  ],
  action:[
    {judul:"DIE HARD", file:"videos/die-hard.mp4", img:"https://image.tmdb.org/t/p/w200/yF43QxbZ7o3U6yZ6.jpg", tipe:"mp4"},
    {judul:"DIE HARD 4.0", file:"videos/die-hard-4.mp4", img:"https://via.placeholder.com/200x300/222/facc15?text=DIE+HARD+4", tipe:"mp4"},
  ]
};

function renderFilm(data){
  const grid=document.getElementById("movieGrid"); grid.innerHTML="";
  for(let kat in data){
    data[kat].slice(0,20).forEach(f=>{
      grid.innerHTML+=`<div class="card" onclick="buka('${f.judul}','${f.file}','${f.tipe}')"><img loading="lazy" src="${f.img}"><div class="card-title">${f.judul}</div></div>`;
    });
  }
}

function filterKategori(kat){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(kat==='all'){ document.getElementById("btn-home").classList.add('active'); renderFilm(dataFilm); return; }
  document.getElementById(`btn-${kat}`)?.classList.add('active');
  let h={}; h[kat]=dataFilm[kat]||[]; renderFilm(h);
}

function cariFilm(){
  let q=document.getElementById("searchBox").value.toLowerCase().trim();
  if(q===""){ filterKategori('all'); return; }
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  let hasil={};
  for(let kat in dataFilm){
    let cocok=dataFilm[kat].filter(f=>f.judul.toLowerCase().includes(q));
    if(cocok.length>0) hasil[kat]=cocok;
  }
  renderFilm(hasil);
}

function buka(j,f,t){aktifFile=f;aktifType=t;document.getElementById("JudulBayar").innerText=j;document.getElementById("judulPlayer").innerText=j;document.getElementById("modalBayar").classList.add('show');}
function tutup(id){document.getElementById(id).classList.remove('show');}
function playFilm(){tutup('modalBayar');document.getElementById("modalPlayer").classList.add('show');let v=document.getElementById("myVideo");v.src=aktifFile;v.play();}
function tutupPlayer(){tutup('modalPlayer');let v=document.getElementById("myVideo");v.pause();v.src="";}

// LOAD AWAL
renderFilm(dataFilm);
</script>
</body>
</html>
