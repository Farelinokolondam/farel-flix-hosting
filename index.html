<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX - Nonton Film Gratis</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff}
header{background:#111;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#ff1a1a;font-weight:bold;font-size:22px}
.nav{display:flex;gap:8px}
.nav a{background:#222;color:#fff;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:14px}
.category{padding:15px 20px}
.category h2{color:#ffcc00;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:210px;object-fit:cover;display:block}
.card p{text-align:center;padding:8px;font-size:12px}
.locked .card::after{content:"🔒 LOGIN UNTUK NONTON";position:absolute;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;color:#ffcc00;font-size:13px;padding:10px}
#guestLock{display:none;min-height:80vh;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#guestLock h1{font-size:60px}
#guestLock h2{color:#ffcc00;margin:15px 0}
.btn-login{background:#e50914;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:15px;border:none;cursor:pointer;font-size:16px}
</style>
</head>
<body>

<header>
  <div class="logo">FARELFLIX 💎</div>
  <div class="nav">
    <a href="#">Home</a><a href="#" onclick="logout()">Logout</a>
  </div>
</header>

<!-- KUNCI TAMU -->
<div id="guestLock">
  <h1>🔒</h1>
  <h2>FILM DIKUNCI UNTUK TAMU</h2>
  <p style="color:#aaa;max-width:380px">Login dulu untuk nonton DIE HARD, JOHN WICK 3, TERMINATOR DARK FATE.</p>
  <button class="btn-login" onclick="loginNow()">LOGIN SEKARANG</button>
</div>

<!-- FILM ASLI -->
<div id="contentFilm">
  <div class="category">
    <h2>ACTION <small style="color:#777;font-size:14px">(3)</small></h2>
    <div class="grid">
      <div class="card" onclick="playFilm()"><img src="https://via.placeholder.com/200x300?text=DIE+HARD"><p>DIE HARD</p></div>
      <div class="card" onclick="playFilm()"><img src="https://via.placeholder.com/200x300?text=JOHN+WICK+3"><p>JOHN WICK 3</p></div>
      <div class="card" onclick="playFilm()"><img src="https://via.placeholder.com/200x300?text=TERMINATOR"><p>TERMINATOR DARK FATE</p></div>
    </div>
  </div>
  <div class="category">
    <h2>TERBARU <small style="color:#777;font-size:14px">(1)</small></h2>
    <div class="grid">
      <div class="card" onclick="playFilm()"><img src="https://via.placeholder.com/200x300?text=JOHN+WICK+4"><p>JOHN WICK CHAPTER 4</p></div>
    </div>
  </div>
</div>

<script>
// CEK STATUS LOGIN
function checkLogin(){
  const isLoggedIn = localStorage.getItem('farel_login') === 'true';
  const guestLock = document.getElementById('guestLock');
  const contentFilm = document.getElementById('contentFilm');

  if (!isLoggedIn) {
    guestLock.style.display = 'flex';
    contentFilm.classList.add('locked');
  } else {
    guestLock.style.display = 'none';
    contentFilm.classList.remove('locked');
  }
}

// FUNGSI LOGIN YANG KAMU MINTA - UDAH DITAMBAH DI SINI
function loginNow(){
  localStorage.setItem('farel_login','true');
  window.location.href='index.html';
}

function logout(){
  localStorage.removeItem('farel_login');
  window.location.href='index.html';
}

function playFilm(){
  const isLoggedIn = localStorage.getItem('farel_login') === 'true';
  if(!isLoggedIn){
    alert('🔒 Film dikunci! Silakan login dulu.');
    document.getElementById('guestLock').style.display='flex';
    window.scrollTo(0,0);
    return;
  }
  alert('▶️ Play film... (sudah login)');
}

checkLogin();
</script>

</body>
</html>
