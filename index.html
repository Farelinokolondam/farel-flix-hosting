<!DOCTYPE html>
<html><head><meta name="google-site-verification" content="5phTkppWJVjmIVYij1c6Gmxd97QzBnH4wFrFUOaVpq8" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FARELFLIX</title>
<style>
/* MATIKAN SEMUA GARIS FOKUS TOTAL */
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent!important;
  outline: none!important;
}
*:focus, *:focus-visible, *:active{
  outline: none!important;
  box-shadow: none!important;
}
html,body,div,img,button{outline:none!important;}

body{margin:0;background:#141414;color:#fff;font-family:Arial}
header{background:#000;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
#semuaKategori{padding:15px;display:block;width:100%;max-width:100vw}
.kategori{margin-bottom:25px}.kategori h2{color:#facc15;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card{
  width:140px;cursor:pointer;background:#222;border-radius:5px;overflow:hidden;
  border: none!important; outline: none!important;
  user-select: none; -webkit-user-select: none;
}
.card img{width:100%;height:210px;object-fit:cover;display:block;pointer-events:none;}
.card p{text-align:center;font-size:11px;padding:5px;margin:0}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{background:#1f1f1f;padding:20px;border-radius:10px;width:90%;max-width:400px;text-align:center}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:15px}
.farel-spinner{width:90px;height:90px;border:3px solid rgba(255,204,0,0.15);border-top:4px solid #facc15;border-right:4px solid #facc15;border-radius:50%;animation: spin 0.8s linear infinite;box-shadow:0 0 20px rgba(250,204,21,0.4)}
.farel-text{color:#facc15;font-weight:bold;letter-spacing:3px;font-size:16px;animation: pulse 1.2s ease-in-out infinite}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.5} }
#videoLoader{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;gap:15px}

/* LOGOUT JARI + ANIMASI KLIK */
#btnLogout{cursor:pointer!important;transition: all 0.2s ease!important;}
#btnLogout:hover{background:#ff1a25!important;transform:scale(1.08);box-shadow:0 0 12px rgba(229,9,20,0.7);}
#btnLogout:active{transform:scale(0.85) rotate(2deg)!important;}
button{cursor:pointer!important;}
</style>
</head><body>
<div id="loadingScreen"><div class="farel-spinner"></div><div class="farel-text">FARELFLIX</div></div>
<header>
<div style="color:#ff4500;font-weight:bold">FARELFLIX-tambala</div>
<div><button onclick="goHome()">Home</button><button onclick="filterKategori('ACTION')">Action</button><button onclick="filterKategori('TERBARU')">Terbaru</button><input id="searchBox" oninput="cariFilm()" placeholder="Cari film..." style="padding:5px;border-radius:15px;border:none"></div>
<div>
<span id="userEmail" style="font-size:11px;color:#fff;margin-right:10px"></span>
<button id="btnAdmin" onclick="bukaAdmin()" style="display:none;background:#facc15;color:#000;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;font-weight:bold">+ TAMBAH FILM</button>
<button id="btnLogout" onclick="logout()" style="background:#e50914;color:#fff;border:none;padding:8px 12px;border-radius:5px;cursor:pointer">Logout</button>
</div>
</header>
<div id="semuaKategori"></div><div id="noResult" style="display:none;text-align:center;padding:20px">Film tidak ditemukan</div>
<div id="modalAdmin" class="modal"><div class="modal-box" style="text-align:left">
<h3 style="color:#facc15;text-align:center">TAMBAH FILM (ADMIN)</h3>
<input id="adminKategori" placeholder="Kategori: ACTION / TERBARU" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<input id="adminJudul" placeholder="Judul film" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<input id="adminFile" placeholder="Link Drive https://.../preview" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<input id="adminGambar" placeholder="Link gambar poster" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<div style="display:flex;gap:10px;margin-top:10px"><button onclick="tutup('modalAdmin')" style="flex:1;padding:10px;background:#333;color:#fff;border:none;border-radius:5px">BATAL</button><button onclick="simpanFilmAdmin()" style="flex:1;padding:10px;background:#facc15;color:#000;font-weight:bold;border:none;border-radius:5px">SIMPAN</button></div>
</div></div>
<div id="modalBayar" class="modal"><div class="modal-box"><h3 id="judulBayar"></h3><button onclick="playFilm()" style="width:100%;padding:10px;background:#facc15;border:none;border-radius:5px">TONTON SEKARANG</button><br><br><button onclick="tutup('modalBayar')">Tutup</button></div></div>
<div id="modalPlayer" class="modal"><div class="modal-box" style="max-width:800px;width:95%;position:relative;overflow:hidden">
<h3 id="judulPlayer"></h3>
<div style="position:relative;width:100%;height:400px;background:#000">
  <div id="videoLoader"><div class="farel-spinner" style="width:70px;height:70px"></div><div class="farel-text" style="font-size:13px">FARELFLIX</div></div>
  <video id="myVideo" controls style="width:100%;height:100%;display:none"></video><iframe id="myIframe" style="width:100%;height:100%;display:none" allowfullscreen></iframe>
</div><br><button onclick="tutupPlayer()">Tutup</button></div></div>
<div id="modalLogout" class="modal"><div class="modal-box"><p>Yakin logout?</p><button onclick="konfirmasiLogout()">Ya</button> <button onclick="tutup('modalLogout')">Batal</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU", authDomain: "farel-flix-tambala.firebaseapp.com", projectId: "farel-flix-tambala", storageBucket: "farel-flix-tambala.firebasestorage.app", messagingSenderId: "265996924707", appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app);
const EMAIL_ADMIN = "farelinokolondam50@gmail.com";
onAuthStateChanged(auth, (user) => {
  if(!user){ window.location.href="login.html"; }
  else {
    document.getElementById("userEmail").innerText=user.email;
    document.getElementById("loadingScreen").style.display="none";
    if(user.email.toLowerCase() === EMAIL_ADMIN.toLowerCase()){
      document.getElementById("btnAdmin").style.display="inline-block";
    } else {
      document.getElementById("btnAdmin").style.display="none";
    }
    if(window.renderFilm && window.dataFilm){ window.renderFilm(window.dataFilm); }
  }
});
window.logout = ()=>{ document.getElementById("modalLogout").style.display="flex"; }
window.konfirmasiLogout = ()=>{ signOut(auth).then(()=>{ window.location.href="login.html"; }); }
window.tutup = (id)=>{ document.getElementById(id).style.display="none"; }
</script>
<script>
const saved = localStorage.getItem("farelFilm");
window.dataFilm = saved? JSON.parse(saved) : {
  "ACTION":[
    {judul:"DIE HARD",file:"https://drive.google.com/file/d/15HSk3mEn9UDUP372LikPRNNod3W1oRsR/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/diehard2023.jpg"},
    {judul:"JOHN WICK 3",file:"https://drive.google.com/file/d/1LP1fanmcoKYm5wQaD4zLnxXwm4rLh41V/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/John_Wick_Chapter_3_Parabellum.png"},
    {judul:"TERMINATOR DARK FATE",file:"https://drive.google.com/file/d/1QikQrqaFpwpd80it7B7YA0AlpnqvlyXW/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/terminator%20dark%20fate.jpg"}
  ],
  "TERBARU":[{judul:"JOHN WICK 4",file:"https://drive.google.com/file/d/1KgoY2XGeEvY4TKY10CU0vkWARyMfrfVV/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/johnwick4.webp"}]
};
let aktifFile="",aktifType="";
const container=document.getElementById("semuaKategori");
window.renderFilm = function(data){
  container.innerHTML=""; let ada=false;
  for(let kat in data){
    if(!data[kat]||data[kat].length==0) continue;
    ada=true;
    let html=`<div class="kategori"><h2>${kat}</h2><div class="row">`;
    data[kat].forEach(f=>{
      html+=`<div class="card" onclick="buka('${f.judul.replace(/'/g,"\\'")}','${f.file}','${f.type}')"><img src="${f.gambar}" onerror="this.src='https://via.placeholder.com/140x210?text=${encodeURIComponent(f.judul)}'"><p>${f.judul}</p></div>`;
    });
    html+=`</div></div>`;
    container.innerHTML+=html;
  }
  document.getElementById("noResult").style.display=ada?"none":"block";
}
window.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>{
    window.renderFilm(window.dataFilm);
    document.getElementById("loadingScreen").style.display="none";
  },500);
});
function bukaAdmin(){ document.getElementById("modalAdmin").style.display="flex"; }
function simpanFilmAdmin(){
  let kat=document.getElementById("adminKategori").value.toUpperCase().trim();
  let judul=document.getElementById("adminJudul").value.trim();
  let file=document.getElementById("adminFile").value.trim();
  let gambar=document.getElementById("adminGambar").value.trim();
  if(!kat||!judul||!file){ alert("Isi kategori, judul, file!"); return; }
  if(!window.dataFilm[kat]) window.dataFilm[kat]=[];
  window.dataFilm[kat].push({judul,file,type:"drive",gambar:gambar||"https://via.placeholder.com/140x210?text="+encodeURIComponent(judul)});
  localStorage.setItem("farelFilm", JSON.stringify(window.dataFilm));
  window.renderFilm(window.dataFilm);
  tutup('modalAdmin');
  document.getElementById("adminKategori").value=""; document.getElementById("adminJudul").value=""; document.getElementById("adminFile").value=""; document.getElementById("adminGambar").value="";
  alert("Berhasil tambah "+judul);
}
function goHome(){document.getElementById("searchBox").value="";window.renderFilm(window.dataFilm);}
function filterKategori(kat){ if(kat==='all'){window.renderFilm(window.dataFilm);return;} let f={}; if(window.dataFilm[kat]) f[kat]=window.dataFilm[kat]; window.renderFilm(f); }
function cariFilm(){ let q=document.getElementById("searchBox").value.toLowerCase(); if(!q){window.renderFilm(window.dataFilm);return;} let h={}; for(let kat in window.dataFilm){ let c=window.dataFilm[kat].filter(x=>x.judul.toLowerCase().includes(q)); if(c.length>0)h[kat]=c; } window.renderFilm(h); }
function buka(j,f,t){ aktifFile=f;aktifType=t; document.getElementById("judulBayar").innerText=j; document.getElementById("judulPlayer").innerText=j; document.getElementById("modalBayar").style.display="flex"; }
function playFilm(){
  document.getElementById("modalBayar").style.display="none"; document.getElementById("modalPlayer").style.display="flex";
  let v=document.getElementById("myVideo"); let i=document.getElementById("myIframe"); let loader=document.getElementById("videoLoader");
  loader.style.display="flex";
  if(aktifType=="drive"){ v.style.display="none"; v.pause(); i.style.display="block"; i.src=aktifFile; i.onload=()=>{loader.style.display="none"}; setTimeout(()=>{loader.style.display="none"},2500); }
  else { i.style.display="none"; i.src=""; v.style.display="block"; v.src=aktifFile; v.play(); v.onplaying=()=>{loader.style.display="none"}; }
}
function tutupPlayer(){ document.getElementById("modalPlayer").style.display="none"; let v=document.getElementById("myVideo"); v.pause(); v.src=""; let i=document.getElementById("myIframe"); i.src=""; document.getElementById("videoLoader").style.display="none"; }
</script></body></html>
