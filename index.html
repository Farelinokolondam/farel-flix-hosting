<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX-tambala</title>
<style>
*{box-sizing:border-box}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column}
body{margin:0;background:#141414;color:#fff;font-family:Arial;width:100%;overflow-x:hidden}
header{background:#000;padding:12px 15px;color:#ff0000;font-size:22px;font-weight:bold;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:2px solid #222;width:100%}
.nav-menu{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-menu button{background:#222;color:#fff;border:1px solid #333;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:13px}
.nav-menu button.active{background:#facc15!important;color:#000!important;font-weight:900}
#searchBox{background:#222;color:#fff;border:1px solid #444;padding:8px 14px;border-radius:20px;width:160px;outline:none}
#semuaKategori{padding:15px;display:none;width:100%;max-width:100vw}
.kategori{margin-bottom:25px;width:100%}
.kategori h2{color:#facc15;margin:10px 0}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;width:100%;scroll-snap-type:x mandatory}
.row::-webkit-scrollbar{display:none}
.card{background:#222;border-radius:8px;min-width:140px;max-width:140px;cursor:pointer;padding:5px;flex-shrink:0;scroll-snap-align:start}
.card img{width:100%;height:210px;object-fit:cover;border-radius:5px}
.card p{font-size:11px;text-align:center;margin:6px 0;white-space:normal;height:30px;overflow:hidden}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:999;padding:15px}
.modal-box{background:#222;padding:20px;border-radius:10px;text-align:center;max-width:90%;min-width:300px;border-top:4px solid #facc15}
button{padding:10px 18px;background:#facc15;border:none;border-radius:5px;font-weight:bold;cursor:pointer;margin:5px;color:#000}
#myIframe{width:100%;height:75vh;border:none;background:#000}
.no-result{text-align:center;color:#777;margin-top:50px;display:none}
@media(max-width:600px){
  header{flex-direction:column;align-items:flex-start}
  #searchBox{width:100%}
}
</style>
</head>
<body>
<div id="loadingScreen"><div style="color:#ff0000;font-size:28px;font-weight:bold;margin-bottom:10px">FARELFLIX</div><div>Loading...</div></div>

<header>
  <span onclick="goHome()" style="cursor:pointer">FARELFLIX-tambala</span>
  <div class="nav-menu">
    <button id="btn-home" class="active" onclick="filterKategori('all')">Home</button>
    <button id="btn-action" onclick="filterKategori('ACTION')">Action</button>
    <button id="btn-terbaru" onclick="filterKategori('TERBARU')">Terbaru</button>
    <input id="searchBox" type="text" placeholder="Cari film..." onkeyup="cariFilm()">
  </div>
  <div><span id="userEmail" style="font-size:11px;color:#fff;margin-right:10px"></span><button onclick="logout()" style="background:#e50914;color:#fff;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;font-size:12px">Logout</button></div>
</header>

<div id="semuaKategori"></div>
<div id="noResult" class="no-result">Film tidak ditemukan 😥</div>

<div id="modalBayar" class="modal"><div class="modal-box"><h3 id="judulBayar"></h3><button onclick="playFilm()"> TONTON LANGSUNG</button><button onclick="tutupModal()" style="background:#333;color:#fff">BATAL</button></div></div>
<div id="modalPlayer" class="modal"><div style="width:100%;text-align:center"><h3 id="judulPlayer"></h3><video id="myVideo" controls></video><iframe id="myIframe" allowfullscreen></iframe><br><button onclick="tutupPlayer()">TUTUP</button></div></div>

<div id="modalLogout" class="modal"><div class="modal-box" style="border-top-color:#e50914">
  <h3>Mau keluar?</h3>
  <p style="color:#aaa;font-size:13px;margin:12px 0">Apakah kamu mau keluar ya atau tidak?</p>
  <div style="display:flex;gap:10px;margin-top:15px">
    <button onclick="tutup('modalLogout')" style="flex:1;background:#333;color:#fff">Tidak</button>
    <button onclick="konfirmasiLogout()" style="flex:1;background:#e50914;color:#fff">Ya</button>
  </div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU", authDomain: "farel-flix-tambala.firebaseapp.com", projectId: "farel-flix-tambala", storageBucket: "farel-flix-tambala.firebasestorage.app", messagingSenderId: "265996924707", appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const loading = document.getElementById("loadingScreen");
const kategori = document.getElementById("semuaKategori");
onAuthStateChanged(auth, (user) => {
  if(!user){ window.location.href="login.html"; }
  else { document.getElementById("userEmail").innerText=user.email; loading.style.display="none"; kategori.style.display="block"; renderFilm(dataFilm); }
});
window.logout = ()=>{ document.getElementById("modalLogout").style.display="flex"; }
window.konfirmasiLogout = ()=>{ signOut(auth).then(()=>{ window.location.href="login.html"; }); }
</script>

<script>
const dataFilm={
  "ACTION":[
    {judul:"DIE HARD",file:"https://drive.google.com/file/d/15HSk3mEn9UDUP372LikPRNNod3W1oRsR/preview",type:"drive",gambar:"gambar/diehard2023.jpg"},
    {judul:"JOHN WICK 3",file:"https://drive.google.com/file/d/1LP1fanmcoKYm5wQaD4zLnxXwm4rLh41V/preview",type:"drive",gambar:"gambar/John_Wick_Chapter_3_Parabellum.png"},
    {judul:"TERMINATOR DARK FATE",file:"https://drive.google.com/file/d/1QikQrqaFpwpd80it7B7YA0AlpnqvlyXW/preview",type:"drive",gambar:"gambar/terminator-dark-fate-defiance-pc-game-steam-cover.jpg"}
  ],
  "TERBARU":[
    {judul:"JOHN WICK 4",file:"https://drive.google.com/file/d/1KgoY2XGeEvY4TKY10CU0vkWARyMfrfVV/preview",type:"drive",gambar:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg"}
  ]
};

let aktifFile="",aktifType="";
const container=document.getElementById("semuaKategori");

function renderFilm(data){
  container.innerHTML="";
  let adaFilm=false;
  for(let kat in data){
    if(data[kat].length===0) continue;
    adaFilm=true;
    let html=`<div class="kategori"><h2>${kat}</h2><div class="row">`;
    data[kat].forEach(f=>{
      html+=`<div class="card" onclick="buka('${f.judul}','${f.file}','${f.type}')"><img src="${f.gambar}" onerror="this.src='https://via.placeholder.com/140x210?text=No+Image'"><p>${f.judul}</p></div>`;
    });
    html+=`</div></div>`;
    container.innerHTML+=html;
  }
  document.getElementById("noResult").style.display = adaFilm? "none" : "block";
}

function goHome(){
  document.getElementById("searchBox").value="";
  document.querySelectorAll('.nav-menu button').forEach(b=>b.classList.remove('active'));
  document.getElementById("btn-home").classList.add('active');
  renderFilm(dataFilm);
  window.scrollTo(0,0);
}

function filterKategori(kat){
  document.getElementById("searchBox").value="";
  document.querySelectorAll('.nav-menu button').forEach(b=>b.classList.remove('active'));
  if(kat==='all'){
    document.getElementById("btn-home").classList.add('active');
    renderFilm(dataFilm);
    return;
  }
  const idBtn = "btn-" + kat.toLowerCase();
  const btn = document.getElementById(idBtn);
  if(btn) btn.classList.add('active');
  let filtered={};
  filtered[kat]=dataFilm[kat];
  renderFilm(filtered);
}

function cariFilm(){
  let q=document.getElementById("searchBox").value.toLowerCase().trim();
  document.querySelectorAll('.nav-menu button').forEach(b=>b.classList.remove('active'));
  if(q===""){ document.getElementById("btn-home").classList.add('active'); renderFilm(dataFilm); return; }
  let hasil={};
  for(let kat in dataFilm){
    let cocok=dataFilm[kat].filter(f=>f.judul.toLowerCase().includes(q));
    if(cocok.length>0) hasil[kat]=cocok;
  }
  renderFilm(hasil);
}

function buka(j,f,t){aktifFile=f;aktifType=t;document.getElementById("judulBayar").innerText=j;document.getElementById("judulPlayer").innerText=j;document.getElementById("modalBayar").style.display="flex";}
function tutup(id){document.getElementById(id).style.display="none";}
function tutupModal(){tutup('modalBayar');}
function playFilm(){tutup('modalBayar');document.getElementById("modalPlayer").style.display="flex";let v=document.getElementById("myVideo");let i=document.getElementById("myIframe");if(aktifType=="drive"||aktifType=="streamtape"){v.style.display="none";v.pause();i.style.display="block";i.src=aktifFile;}else{i.style.display="none";i.src="";v.style.display="block";v.src=aktifFile;v.play();}}
function tutupPlayer(){tutup('modalPlayer');let v=document.getElementById("myVideo");v.pause();v.src="";let i=document.getElementById("myIframe");i.src="";i.style.display="none";}
</script>
</body>
</html>
