<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Arial}
.top-bar{background:linear-gradient(90deg,#1e3a8a,#1e40af);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:100}
.top-logo{font-size:28px;font-weight:900;color:#facc15;letter-spacing:1px;cursor:pointer}.top-logo span{color:#fff}
.top-search{flex:1;max-width:400px}.top-search input{width:100%;padding:9px 15px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.4);color:#fff;outline:none;font-size:13px}
.top-links{display:flex;gap:14px;font-size:12px;font-weight:bold;align-items:center}.top-links a{color:#fff;text-decoration:none;cursor:pointer}.top-links a:hover{color:#facc15}
#logoutBtn{background:#e50914;padding:6px 14px;border-radius:4px}
.mid-bar{background:#dc2626;padding:9px 20px;display:flex;gap:22px;align-items:center;font-size:13px;font-weight:700;overflow-x:auto;white-space:nowrap}
.mid-bar a{color:#fff;text-decoration:none;cursor:pointer}.mid-bar a:hover{color:#facc15}
.bot-bar{background:#facc15;padding:8px 20px;display:flex;gap:18px;align-items:center;font-size:11px;font-weight:900;overflow-x:auto;white-space:nowrap;color:#000}
.bot-bar a{color:#000;text-decoration:none;cursor:pointer;padding:3px 6px;border-radius:3px}.bot-bar a:hover{background:#000;color:#facc15}
.container{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:#161616;border-radius:6px;overflow:hidden;cursor:pointer;transition:0.2s;border:1px solid #222}
.card:hover{transform:scale(1.05);border-color:#e50914}
.card img{width:100%;height:210px;object-fit:cover;background:#222}
.card-info{padding:8px}.card-title{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-quality{font-size:9px;background:#e50914;padding:2px 5px;border-radius:3px;display:inline-block;margin-top:4px}
#logoutModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);justify-content:center;align-items:center}#logoutModal.show{display:flex}
.modal-box{background:#111;border-top:4px solid #e50914;border-radius:8px;padding:28px 22px;width:330px;text-align:center}
.modal-btns{display:flex;gap:10px;margin-top:18px}.modal-btns button{flex:1;padding:10px;border-radius:4px;font-weight:bold;cursor:pointer;border:none}
#btnTidak{background:#2a2a2a;color:#fff}#btnYa{background:#e50914;color:#fff}
@media(max-width:768px){.top-search{max-width:100%;order:3;width:100%;margin-top:8px}.top-bar{flex-wrap:wrap}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-logo" onclick="location.reload()">FAREL<span>FLIX</span></div>
  <div class="top-search"><input type="text" id="searchInput" placeholder="Cari Judul, Artis, IMDb"></div>
  <div class="top-links">
    <a onclick="filterType('720p')">720P</a>
    <a onclick="filterType('1080p')">1080P</a>
    <a>HD QUALITY</a>
    <a id="userEmail" style="font-size:10px;opacity:0.7"></a>
    <a id="logoutBtn">Logout</a>
  </div>
</div>

<div class="mid-bar">
  <a onclick="loadAll()">🏠 Home</a>
  <a>Index Movie™</a>
  <a>🎬 Genre ▾</a>
  <a>⭐ Populer ▾</a>
  <a>🌎 Negara ▾</a>
  <a>📅 Tahun ▾</a>
</div>

<div class="bot-bar">
  <a onclick="filterGenre('action')">ACTION</a>
  <a onclick="filterGenre('animation')">ANIMATION</a>
  <a onclick="filterGenre('horror')">HORROR</a>
  <a onclick="filterGenre('sci-fi')">SCI-FI</a>
  <a onclick="filterGenre('comedy')">COMEDY</a>
  <a onclick="filterGenre('romance')">ROMANCE</a>
  <a onclick="filterGenre('china')">CHINA</a>
  <a onclick="filterGenre('india')">INDIA</a>
  <a onclick="filterGenre('japan')">JAPAN</a>
  <a onclick="filterGenre('korea')">KOREA</a>
  <a onclick="filterGenre('thailand')">THAILAND</a>
  <a onclick="filterGenre('2026')">2026</a>
  <a onclick="filterGenre('bluray')">BLURAY</a>
</div>

<div class="container"><div class="grid" id="movieGrid"></div></div>

<div id="logoutModal"><div class="modal-box"><h3>Mau keluar?</h3><p style="color:#aaa;font-size:13px;margin-top:6px">Apakah kamu mau keluar ya atau tidak?</p><div class="modal-btns"><button id="btnTidak">Tidak</button><button id="btnYa">Ya, Keluar</button></div></div></div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

onAuthStateChanged(auth,u=>{if(!u) location.href="login.html"; else document.getElementById("userEmail").innerText=u.email.split('@')[0];});
const modal=document.getElementById("logoutModal");
document.getElementById("logoutBtn").onclick=e=>{e.preventDefault();modal.classList.add("show");};
document.getElementById("btnTidak").onclick=()=>modal.classList.remove("show");
document.getElementById("btnYa").onclick=async()=>{await signOut(auth);location.href="login.html";};
modal.onclick=e=>{if(e.target===modal) modal.classList.remove("show");};

const grid=document.getElementById("movieGrid");
const API_KEY="b5d2609cc50d349a1ca5ab2c5aa26a57"; // API KEY AKTIF

const dummyMovies=[
 {title:"ROOM SERVICE",img:"https://image.tmdb.org/t/p/w500/kDp1vUBnMpe8ak4rjgl3cLELqjU.jpg",q:"WEBDL"},
 {title:"THE BUNNY GAME",img:"https://image.tmdb.org/t/p/w500/8L3N2aF3aHq3cZb5ZQ.jpg",q:"BluRay"},
 {title:"AMERICAN TRANSLATION",img:"https://image.tmdb.org/t/p/w500/5EAlqg6WqR2z3c.jpg",q:"BluRay"},
 {title:"AVENGERS ENDGAME",img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",q:"1080P"},
 {title:"JOHN WICK 4",img:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg",q:"720P"},
 {title:"OPPENHEIMER",img:"https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg",q:"WEBDL"},
 {title:"ONE PIECE RED",img:"https://image.tmdb.org/t/p/w500/kDp1vUBnMpe8ak4rjgl3cLELqjU.jpg",q:"WEBRip"},
 {title:"FAST X",img:"https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdclSiC.jpg",q:"Bluray"}
];

function render(list){
 grid.innerHTML="";
 list.forEach(m=>{
  const poster=m.img || (m.poster_path?`https://image.tmdb.org/t/p/w300${m.poster_path}`:`https://via.placeholder.com/300x450/111/facc15?text=${encodeURIComponent(m.title)}`);
  grid.innerHTML+=`<div class="card"><img src="${poster}" onerror="this.src='https://via.placeholder.com/300x450/111/facc15?text=FAREL+FLIX'"><div class="card-info"><div class="card-title">${m.title||m.name}</div><div class="card-quality">${m.q||'WEBDL'}</div></div></div>`;
 });
}

async function loadAll(){
 grid.innerHTML="<p style='grid-column:1/-1;text-align:center;padding:40px'>Loading...</p>";
 try{
  const r=await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=id-ID`);
  const d=await r.json();
  if(d.results && d.results.length>0){ render(d.results.map(x=>({title:x.title,poster_path:x.poster_path,q:'WEBDL'}))); }
  else render(dummyMovies);
 }catch(e){ render(dummyMovies); }
}

window.loadAll=loadAll;
window.filterGenre=(g)=>{ const f=dummyMovies.filter(m=>m.title.toLowerCase().includes(g.toLowerCase())); render(f.length?f:dummyMovies); };
window.filterType=()=>loadAll();
window.filterByGenre=window.filterGenre;

document.getElementById("searchInput").addEventListener("keypress",e=>{
 if(e.key==="Enter" && e.target.value.trim()!==""){
  const q=e.target.value.toLowerCase();
  const f=dummyMovies.filter(m=>m.title.toLowerCase().includes(q));
  if(f.length>0) render(f);
  else fetch(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&query=${q}`).then(r=>r.json()).then(d=>render(d.results.map(x=>({title:x.title,poster_path:x.poster_path,q:'WEBDL'})))).catch(()=>render(dummyMovies));
 }
});

loadAll();
</script>
</body>
</html>
