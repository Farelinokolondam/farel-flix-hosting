.farel-spinner{width:90px;height:90px;border:3px solid rgba(255,204,0,0.15);border-top:4px solid #facc15;border-right:4px solid #facc15;border-radius:50%;animation: spin 0.8s linear infinite;box-shadow:0 0 20px rgba(250,204,21,0.4)}

button{cursor:pointer!important;}
/* BLUR EMAIL FITUR BARU */

 .header-left{width:100%;font-size:16px;text-align:center}

 .card{width:calc(50% - 6px)}
 .imgBox{height:220px}

</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, serverTimestamp, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU", authDomain: "farel-flix-tambala.firebaseapp.com", projectId: "farel-flix-tambala", storageBucket: "farel-flix-tambala.firebasestorage.app", messagingSenderId: "265996924707", appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const EMAIL_ADMIN = "farelinokolondam50@gmail.com";
let currentUserDoc = null;
let userListCache = [];
let liveTimer = null;
let heartbeatTimer = null;
let userFilterMode = 'all';
let userSearch = '';
let isBlurOn = false;

function waktuLalu(date){
  if(!date) return "-";
  const diff = Math.floor((new Date() - date)/1000);
  if(diff < 5) return "baru saja";
  if(diff < 60) return diff+" detik lalu";
  if(diff < 3600) return Math.floor(diff/60)+" menit lalu";
  if(diff < 86400) return Math.floor(diff/3600)+" jam lalu";
  return Math.floor(diff/86400)+" hari lalu";
}
function getDeviceAndMedia(){
  const ua = navigator.userAgent;
  let model = "";
  const androidM = ua.match(/Android.*?;\s*([^;\)]+)\s*Build/i);
  if(androidM) model = androidM[1].trim();
  else if(/iPhone/i.test(ua)) model = "iPhone";
  else if(/iPad/i.test(ua)) model = "iPad";
  let device = "💻 Desktop";
  if(/Android/i.test(ua)) device = "📱 " + (model || "Android Phone");
  else if(/iPhone/i.test(ua)) device = "📱 " + model;
  else if(/iPad/i.test(ua)) device = "📱 iPad";
  let browser = "Browser";
  if(ua.includes("Chrome") &&!ua.includes("Edg")) browser = "Chrome";
  else if(ua.includes("Firefox")) browser = "Firefox";
  else if(ua.includes("Safari") &&!ua.includes("Chrome")) browser = "Safari";
  else if(ua.includes("Edg")) browser = "Edge";
  let os = "";
  if(ua.includes("Android")) os = "Android";
  else if(ua.includes("Windows")) os = "Windows";
  else if(ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
  else if(ua.includes("Mac")) os = "MacOS";
  let ref = document.referrer || "";
  let media = "Langsung";
  if(ref.includes("facebook.com") || ref.includes("fb.com")) media = "Facebook";
  else if(ref.includes("instagram.com")) media = "Instagram";
  else if(ref.includes("google.com")) media = "Google";
  else if(ref.includes("whatsapp") || ref.includes("wa.me")) media = "WhatsApp";
  else if(ref.includes("t.me")) media = "Telegram";
  else if(ref!== "") { try{ media = new URL(ref).hostname; }catch(e){} }
  return { fullText: `${device} - ${os} - ${browser}`, model: model || "Desktop", browser, os, media, ref, situs: window.location.hostname };
}
async function getLokasi(){
  try{
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();
    return {
      kota: data.city || "-", region: data.region || "-", negara: data.country_name || "-", ip: data.ip || "-",
      lokasiText: `${data.city || ""}, ${data.region || ""}`.replace(/^, /,"").trim() || data.country_name || "Tidak terdeteksi"
    };
  }catch(e){ return { kota:"-", region:"-", negara:"-", ip:"-", lokasiText:"Lokasi off" }; }
}

onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href="login.html"; }
  else {
    document.getElementById("userEmail").innerText=user.email;
    document.getElementById("loadingScreen").style.display="none";
    currentUserDoc = doc(db, "users_log", user.uid);

    onSnapshot(currentUserDoc, (snap)=>{
      if(snap.exists() && snap.data().isBanned){
        alert("🚫 AKUN KAMU DI-BANNED ADMIN!");
        signOut(auth).then(()=>window.location.href="login.html");
      }
      if(snap.exists() && snap.data().kicked){
        alert("👢 KAMU DI-KICK ADMIN!");
        setDoc(currentUserDoc, {kicked:false}, {merge:true});
        signOut(auth).then(()=>window.location.href="login.html");
      }
    });

    let loginVia = "Email/Password";
    if(user.providerData && user.providerData[0]){
      const p = user.providerData[0].providerId;
      if(p === "google.com") loginVia = "🔵 Google";
      else if(p === "facebook.com") loginVia = "🔵 Facebook";
      else if(p === "password") loginVia = "📧 Email";
      else if(p === "phone") loginVia = "📱 No HP";
      else loginVia = p;
    }
    const dev = getDeviceAndMedia();
    const lok = await getLokasi();
    try{
      await setDoc(currentUserDoc, {
        email: user.email, lastLogin: serverTimestamp(), lastActive: serverTimestamp(), isOnline: true, uid: user.uid,
        loginVia: loginVia, device: dev.fullText, hp_model: dev.model, browser: dev.browser, os: dev.os,
        situs_login: dev.situs, datang_dari_media: dev.media, lokasi: lok.lokasiText, kota: lok.kota, region: lok.region, ip: lok.ip, isBanned:false, kicked:false
      }, {merge:true});
      if(heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(()=>{ setDoc(currentUserDoc, { lastActive: serverTimestamp(), isOnline: true }, {merge:true}); }, 10000);
    }catch(e){ console.log(e); }

    onSnapshot(collection(db, "users_log"), (snap)=>{
      let online = 0; userListCache = [];
      snap.forEach(d=>{
        const u=d.data(); u._id = d.id;
        const diff = u.lastActive?.toDate? Math.floor((new Date() - u.lastActive.toDate())/1000) : 9999;
        if(u.isOnline && diff < 120 &&!u.isBanned) online++;
        userListCache.push(u);
      });
      document.getElementById("statUserCount").innerText = snap.size;
      document.getElementById("statOnlineCount").innerText = online;
      if(document.getElementById("modalUsers").style.display=="flex") renderUserList();
    });

    if(user.email.toLowerCase() === EMAIL_ADMIN.toLowerCase()){
      document.getElementById("btnAdmin").style.display="inline-block";
      document.getElementById("btnUsers").style.display="inline-block";
      window.isAdmin = true;
      document.getElementById("adminDashboard").style.display="flex";
    } else { window.isAdmin = false; }
    if(window.renderFilm && window.dataFilm){ window.renderFilm(window.dataFilm); }
  }
});

window.kickUser = async (uid,email)=>{
  if(!confirm("KICK "+email+"? Dia akan logout paksa!")) return;
  await setDoc(doc(db,"users_log",uid), {isOnline:false, kicked:true, lastActive: serverTimestamp()}, {merge:true});
  alert("Berhasil KICK "+email);
}
window.banUser = async (uid,email)=>{
  if(!confirm("BAN PERMANEN "+email+"?")) return;
  await setDoc(doc(db,"users_log",uid), {isBanned:true, isOnline:false}, {merge:true});
  alert("🚫 "+email+" DI-BANNED");
}
window.unbanUser = async (uid,email)=>{
  await setDoc(doc(db,"users_log",uid), {isBanned:false}, {merge:true});
  alert("✅ "+email+" UNBANNED");
}
window.resetPass = async (email)=>{
  if(!confirm("Kirim link ganti password ke "+email+"?")) return;
  try{ await sendPasswordResetEmail(auth, email); alert("📧 Link reset terkirim ke "+email); }
  catch(e){ alert("Gagal: "+e.message); }
}
window.hapusUserLog = async (uid,email)=>{
  if(!confirm("Hapus log "+email+"?")) return;
  await deleteDoc(doc(db,"users_log",uid));
  alert("Terhapus");
}
window.setUserFilter = (mode)=>{
  userFilterMode=mode;
  ['fAll','fOnline','fOffline','fBanned'].forEach(id=>{document.getElementById(id).style.background='#222'; document.getElementById(id).style.color='#fff';});
  const map={all:'fAll',online:'fOnline',offline:'fOffline',banned:'fBanned'};
  document.getElementById(map[mode]).style.background='#facc15'; document.getElementById(map[mode]).style.color='#000';
  renderUserList();
}
window.filterUserEmail = ()=>{
  userSearch = document.getElementById("filterEmail").value.toLowerCase();
  renderUserList();
}
window.toggleBlur = ()=>{
  isBlurOn =!isBlurOn;
  document.getElementById("btnBlur").innerText = isBlurOn? "🙈 BLUR: ON" : "👁️ BLUR: OFF";
  document.getElementById("btnBlur").style.background = isBlurOn? "#facc15" : "#222";
  document.getElementById("btnBlur").style.color = isBlurOn? "#000" : "#facc15";
  renderUserList();
}

function renderUserList(){
  const list = document.getElementById("listUsers");
  let filtered = [...userListCache];
  if(userSearch){ filtered = filtered.filter(u=>u.email.toLowerCase().includes(userSearch)); }

  // FIX: BANNED HANYA DI BANNED, TIDAK DI OFFLINE / SEMUA
  if(userFilterMode==='all'){ filtered = filtered.filter(u=>!u.isBanned); }
  else if(userFilterMode==='online'){ filtered = filtered.filter(u=>{ const d=u.lastActive?.toDate?Math.floor((new Date()-u.lastActive.toDate())/1000):9999; return u.isOnline && d<120 &&!u.isBanned; }); }
  else if(userFilterMode==='offline'){ filtered = filtered.filter(u=>{ const d=u.lastActive?.toDate?Math.floor((new Date()-u.lastActive.toDate())/1000):9999; return!(u.isOnline && d<120) &&!u.isBanned; }); }
  else if(userFilterMode==='banned'){ filtered = filtered.filter(u=>u.isBanned); }

  if(!filtered.length){ list.innerHTML="<div style='text-align:center;color:#888;padding:20px'>Tidak ada user</div>"; return; }
  filtered.sort((a,b)=> (b.lastActive?.seconds||0) - (a.lastActive?.seconds||0));
  let html = `<div style="display:flex;flex-direction:column;gap:10px">`;
  filtered.forEach(u=>{
    const d = u.lastActive?.toDate? u.lastActive.toDate() : null;
    const diff = d? Math.floor((new Date() - d)/1000) : 99999;
    const online = u.isOnline && diff < 120 &&!u.isBanned;
    const dot = u.isBanned? `<b style="color:#ff4444">🚫 BANNED</b>` : online? `<span style="background:#00ff88;width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 8px #00ff88"></span> <b style="color:#00ff88">ONLINE</b>` : `<span style="background:#555;width:9px;height:9px;border-radius:50%;display:inline-block"></span> <span style="color:#888">OFFLINE</span>`;
    const blurClass = isBlurOn? "blurred" : "";

    let actionButtons = "";
    if(u.email.toLowerCase()!== EMAIL_ADMIN.toLowerCase()){
      if(u.isBanned){
        actionButtons = `
        <div style="margin-top:10px;display:flex;gap:6px">
          <button onclick="unbanUser('${u._id}','${u.email}')" style="width:100%;background:#00ff88;color:#000;border:none;padding:10px;border-radius:8px;font-size:13px;font-weight:bold;box-shadow:0 0 12px rgba(0,255,136,0.4)">✅ UNBAN</button>
        </div>`;
      } else {
        actionButtons = `
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
          <button onclick="kickUser('${u._id}','${u.email}')" style="flex:1;min-width:60px;background:#ff9500;color:#000;border:none;padding:6px;border-radius:6px;font-size:11px;font-weight:bold">👢 KICK</button>
          <button onclick="banUser('${u._id}','${u.email}')" style="flex:1;min-width:60px;background:#ff4444;color:#fff;border:none;padding:6px;border-radius:6px;font-size:11px;font-weight:bold">🚫 BAN</button>
          <button onclick="resetPass('${u.email}')" style="flex:1;min-width:80px;background:#00d1ff;color:#000;border:none;padding:6px;border-radius:6px;font-size:11px;font-weight:bold">🔑 RESET PASS</button>
          <button onclick="hapusUserLog('${u._id}','${u.email}')" style="background:#333;color:#aaa;border:none;padding:6px 10px;border-radius:6px;font-size:11px">🗑️</button>
        </div>`;
      }
    } else {
      actionButtons = `<div style="margin-top:8px;color:#facc15;font-size:10px">👑 Admin tidak bisa di-kick</div>`;
    }

    html+=`
    <div style="background:linear-gradient(135deg,#252525,#1e1e1e);border:1px solid ${u.isBanned?'#ff4444':online?'#00ff8844':'#333'};border-radius:12px;padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div class="${blurClass}" style="font-weight:bold;color:#fff;word-break:break-all;font-size:13px">${u.email} ${u.email===EMAIL_ADMIN?'<span style="color:#facc15">👑</span>':''}</div>
        <div style="font-size:11px;white-space:nowrap">${dot}</div>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        <span style="background:#00d1ff22;border:1px solid #00d1ff44;color:#00d1ff;padding:3px 8px;border-radius:12px;font-size:10px">${u.loginVia||"Email"}</span>
        <span style="background:#facc1522;border:1px solid #facc1544;color:#facc15;padding:3px 8px;border-radius:12px;font-size:10px">${waktuLalu(d)}</span>
        <span style="background:#00ff8822;border:1px solid #00ff8844;color:#00ff88;padding:3px 8px;border-radius:12px;font-size:10px">📍 ${u.lokasi||u.kota||"..."}</span>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#ccc;line-height:1.4">
        <div>📱 <b style="color:#facc15">${u.hp_model||"Desktop"}</b> - ${u.browser||""} ${u.os||""}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">IP: <span class="${blurClass}">${u.ip||"-"}</span> | Dari: ${u.datang_dari_media||"Langsung"}</div>
        <div style="font-size:9px;color:#555;margin-top:2px">${d? d.toLocaleString('id-ID'):''}</div>
      </div>
      ${actionButtons}
    </div>`;
  });
  html+=`</div>`;
  list.innerHTML=html;
}
window.bukaUsers = ()=>{
  document.getElementById("modalUsers").style.display="flex";
  renderUserList();
  if(liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(()=>{ renderUserList(); }, 1000);
}
window.logout = ()=>{ document.getElementById("modalLogout").style.display="flex"; }
window.konfirmasiLogout = async ()=>{
  try{ if(currentUserDoc){ await setDoc(currentUserDoc, { isOnline: false, lastActive: serverTimestamp() }, {merge:true}); } }catch(e){}
  if(liveTimer) clearInterval(liveTimer);
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  signOut(auth).then(()=>{ window.location.href="login.html"; });
}

}

<script>
const saved = localStorage.getItem("farelFilm");
window.dataFilm = saved? JSON.parse(saved) : {
  "ACTION":[
    {judul:"DIE HARD",file:"https://drive.google.com/file/d/15HSk3mEn9UDUP372LikPRNNod3W1oRsR/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/diehard2023.jpg"},
    {judul:"JOHN WICK 3",file:"https://drive.google.com/file/d/1LP1fanmcoKYm5wQaD4zLnxXwm4rLh41V/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/John_Wick_Chapter_3_Parabellum.png"},
    {judul:"TERMINATOR DARK FATE",file:"https://drive.google.com/file/d/1QikQrqaFpwpd80it7B7YA0AlpnqvlyXW/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/terminator%20dark%20fate.jpg"}
  ],
  "TERBARU":[{judul:"JOHN WICK 4",file:"https://drive.google.com/file/d/1KgoY2XGeEvY4TKY10CU0vkWARyMfrfVV/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/johnwick4.webp"}]
};
let aktifFile="",aktifType="";
window.isAdmin = false;
const container=document.getElementById("semuaKategori");
window.renderFilm = function(data){
  container.innerHTML=""; let ada=false; let totalFilm=0; let katCount = 0;
  for(let kat in data){
    if(!data[kat]||data[kat].length==0) continue;
    ada=true; katCount++; totalFilm+=data[kat].length;
    let html=`<div class="kategori"><h2>${kat}</h2><div class="row">`;
    data[kat].forEach((f, idx)=>{
      html+=`<div class="card ${window.isAdmin?'admin':''}" onclick="buka('${f.judul.replace(/'/g,"\\'")}','${f.file}','${f.type}')"><div class="imgBox"><img src="${f.gambar}" onerror="this.src='https://via.placeholder.com/140x210?text=${encodeURIComponent(f.judul)}'"><button class="btnHapus" onclick="event.stopPropagation(); hapusFilm('${kat}',${idx})">×</button></div><p>${f.judul}</p></div>`;
    });
    html+=`</div></div>`;
    container.innerHTML+=html;
  }
  document.getElementById("noResult").style.display=ada?"none":"block";
  document.getElementById("statFilm").innerText = totalFilm;
  document.getElementById("statKat").innerText = katCount;
}
window.hapusFilm = function(kat, idx){
  if(!confirm("Hapus film "+window.dataFilm[kat][idx].judul+"?")) return;
  window.dataFilm[kat].splice(idx,1);
  if(window.dataFilm[kat].length===0) delete window.dataFilm[kat];
  localStorage.setItem("farelFilm", JSON.stringify(window.dataFilm));
  window.renderFilm(window.dataFilm);
}
window.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>{
    window.renderFilm(window.dataFilm);
    document.getElementById("loadingScreen").style.display="none";
  },500);
});
function bukaAdmin(){ document.getElementById("modalAdmin").style.display="flex"; }
function simpanFilmAdmin(){
  let kat=document.getElementById("adminKategori").value.toUpperCase().trim();
  let judul=document.getElementById("adminJudul").value.trim();
  let file=document.getElementById("adminFile").value.trim();
  let gambar=document.getElementById("adminGambar").value.trim();
  if(!kat||!judul||!file){ alert("Isi kategori, judul, file!"); return; }
  if(!window.dataFilm[kat]) window.dataFilm[kat]=[];
  window.dataFilm[kat].push({judul,file,type:"drive",gambar:gambar||"https://via.placeholder.com/140x210?text="+encodeURIComponent(judul)});
  localStorage.setItem("farelFilm", JSON.stringify(window.dataFilm));
  window.renderFilm(window.dataFilm);
  tutup('modalAdmin');
  document.getElementById("adminKategori").value=""; document.getElementById("adminJudul").value=""; document.getElementById("adminFile").value=""; document.getElementById("adminGambar").value="";
  alert("Berhasil tambah "+judul);
}
function goHome(){document.getElementById("searchBox").value="";window.renderFilm(window.dataFilm);}
function filterKategori(kat){ if(kat==='all'){window.renderFilm(window.dataFilm);return;} let f={}; if(window.dataFilm[kat]) f[kat]=window.dataFilm[kat]; window.renderFilm(f); }
function cariFilm(){ let q=document.getElementById("searchBox").value.toLowerCase(); if(!q){window.renderFilm(window.dataFilm);return;} let h={}; for(let kat in window.dataFilm){ let c=window.dataFilm[kat].filter(x=>x.judul.toLowerCase().includes(q)); if(c.length>0)h[kat]=c; } window.renderFilm(h); }
function buka(j,f,t){ aktifFile=f;aktifType=t; document.getElementById("judulBayar").innerText=j; document.getElementById("judulPlayer").innerText=j; document.getElementById("modalBayar").style.display="flex"; }
function playFilm(){
  document.getElementById("modalBayar").style.display="none"; document.getElementById("modalPlayer").style.display="flex";
  let v=document.getElementById("myVideo"); let i=document.getElementById("myIframe"); let loader=document.getElementById("videoLoader");
  loader.style.display="flex";
  if(aktifType=="drive"){ v.style.display="none"; v.pause(); i.style.display="block"; i.src=aktifFile; i.onload=()=>{loader.style.display="none"}; setTimeout(()=>{loader.style.display="none"},2500); }
  else { i.style.display="none"; i.src=""; v.style.display="block"; v.src=aktifFile; v.play(); v.onplaying=()=>{loader.style.display="none"}; }
}
function tutupPlayer(){ document.getElementById("modalPlayer").style.display="none"; let v=document.getElementById("myVideo"); v.pause(); v.src=""; let i=document.getElementById("myIframe"); i.src=""; document.getElementById("videoLoader").style.display="none"; }
</script></body></html>
