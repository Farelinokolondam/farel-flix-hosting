<!DOCTYPE html>
<html><head><meta name="google-site-verification" content="5phTkppWJVjmIVYij1c6Gmxd97QzBnH4wFrFUOaVpq8" /><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FARELFLIX</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color: transparent!important;outline: none!important;}
*:focus, *:focus-visible, *:active{outline: none!important;box-shadow: none!important;}
html,body,div,img,button{outline:none!important;}
body{margin:0;background:#141414;color:#fff;font-family:Arial}
header{background:#000;padding:12px 15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100; border-bottom:1px solid #222;}
.header-left{color:#ff4500;font-weight:bold;font-size:18px;letter-spacing:1px}
.header-center{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.header-center button{background:#222;color:#fff;border:1px solid #333;padding:7px 14px;border-radius:20px;cursor:pointer;transition:0.2s}
.header-center button:hover{background:#facc15;color:#000;border-color:#facc15}
.header-center input{padding:7px 14px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;width:160px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#semuaKategori{padding:15px;display:block;width:100%;max-width:100vw}
.kategori{margin-bottom:25px}.kategori h2{color:#facc15;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:12px}
#adminDashboard{display:none;background:linear-gradient(90deg,#1f1f1f,#2a2a1a);border:1px solid #333;border-left:4px solid #facc15;padding:12px 18px;margin:15px;border-radius:8px;gap:12px 20px;align-items:center;flex-wrap:wrap}
#adminDashboard b{color:#facc15}
#adminDashboard b.online{color:#00ff88}
.stat{font-size:13px}
.card{width:140px;cursor:pointer;background:#222;border-radius:6px;overflow:hidden;border: none!important; outline: none!important;user-select: none; -webkit-user-select: none;display:flex; flex-direction:column; position:relative;transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)!important;transform-origin: center bottom;}
.imgBox{width:100%; height:210px; overflow:hidden; background:#000; flex-shrink:0; position:relative;}
.imgBox img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition: transform 0.4s ease, filter 0.4s ease!important;}
.card p{text-align:center;font-size:11px;padding:8px 5px;margin:0;background:#222;position:relative; z-index:2; width:100%;transition: all 0.3s ease;}
.card:hover{transform: scale(1.08) translateY(-10px)!important;box-shadow: 0 15px 35px rgba(0,0,0,0.85), 0 0 18px rgba(250,204,21,0.35)!important;z-index: 10;}
.card:hover.imgBox img{transform: scale(1.18)!important;filter: brightness(1.25) contrast(1.1);}
.card:hover p{color:#facc15;font-weight:bold;}
.card:active{transform: scale(0.95)!important;}
.btnHapus{position:absolute;top:5px;right:5px;z-index:10;background:#e50914;color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;font-weight:bold;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.7)}
.card.admin.btnHapus{display:flex}
.btnHapus:hover{background:#ff1a25;transform:scale(1.15)}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{background:#1f1f1f;padding:20px;border-radius:10px;width:90%;max-width:400px;text-align:center}
#loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:15px}
.farel-spinner{width:90px;height:90px;border:3px solid rgba(255,204,0,0.15);border-top:4px solid #facc15;border-right:4px solid #facc15;border-radius:50%;animation: spin 0.8s linear infinite;box-shadow:0 0 20px rgba(250,204,21,0.4)}
.farel-text{color:#facc15;font-weight:bold;letter-spacing:3px;font-size:16px;animation: pulse 1.2s ease-in-out infinite}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.5} }
#videoLoader{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;gap:15px}
#btnLogout{cursor:pointer!important;transition: all 0.2s ease!important;}
#btnLogout:hover{background:#ff1a25!important;transform:scale(1.08);box-shadow:0 0 12px rgba(229,9,20,0.7);}
button{cursor:pointer!important;}
@media(max-width:600px){
  header{padding:10px;gap:8px}
.header-left{width:100%;font-size:16px}
.header-center{width:100%}
.header-center input{width:100%;margin-top:4px}
.header-right{width:100%;justify-content:flex-start;margin-top:6px}
  span#userEmail{width:100%;font-size:10px!important;margin-bottom:6px;display:block}
  #adminDashboard{margin:10px;padding:10px 12px;gap:8px 14px}
.card{width:calc(50% - 6px)}
.imgBox{height:240px}
  #semuaKategori{padding:10px}
}
</style>
</head><body>
<div id="loadingScreen"><div class="farel-spinner"></div><div class="farel-text">FARELFLIX</div></div>
<header>
<div class="header-left">FARELFLIX-tambala</div>
<div class="header-center">
<button onclick="goHome()">Home</button>
<button onclick="filterKategori('ACTION')">Action</button>
<button onclick="filterKategori('TERBARU')">Terbaru</button>
<input id="searchBox" oninput="cariFilm()" placeholder="Cari film...">
</div>
<div class="header-right">
<span id="userEmail" style="font-size:11px;color:#aaa;margin-right:6px"></span>
<button id="btnUsers" onclick="bukaUsers()" style="display:none;background:#00d1ff;color:#000;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;font-weight:bold">👥 USER</button>
<button id="btnAdmin" onclick="bukaAdmin()" style="display:none;background:#facc15;color:#000;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;font-weight:bold">+ TAMBAH FILM</button>

<div id="adminDashboard">
  <div class="stat">👑 Mode Admin Aktif | </div>

  <div class="stat" style="color:#00d1ff">User: <b id="statUserCount">0</b></div>

</div>
<div id="semuaKategori"></div><div id="noResult" style="display:none;text-align:center;padding:20px">Film tidak ditemukan</div>
<div id="modalAdmin" class="modal"><div class="modal-box" style="text-align:left">
<h3 style="color:#facc15;text-align:center">TAMBAH FILM (ADMIN)</h3>
<input id="adminKategori" placeholder="Kategori: ACTION / TERBARU" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<input id="adminJudul" placeholder="Judul film" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<input id="adminFile" placeholder="Link Drive https://.../preview" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<input id="adminGambar" placeholder="Link gambar poster" style="width:100%;padding:10px;margin:6px 0;background:#111;color:#fff;border-radius:5px">
<div style="display:flex;gap:10px;margin-top:10px"><button onclick="tutup('modalAdmin')" style="flex:1;padding:10px;background:#333;color:#fff;border:none;border-radius:5px">BATAL</button><button onclick="simpanFilmAdmin()" style="flex:1;padding:10px;background:#facc15;color:#000;font-weight:bold;border:none;border-radius:5px">SIMPAN</button></div>
</div></div>
<div id="modalUsers" class="modal"><div class="modal-box" style="text-align:left;max-width:750px;width:95%;max-height:80vh;overflow:auto">
<h3 style="color:#00d1ff;text-align:center">DAFTAR USER YANG LOGIN</h3>
<div id="listUsers" style="font-size:12px">Loading...</div>
<br><button onclick="tutup('modalUsers')" style="width:100%;padding:10px;background:#333;color:#fff;border:none;border-radius:5px">TUTUP</button>
</div></div>
<div id="modalBayar" class="modal"><div class="modal-box"><h3 id="judulBayar"></h3><button onclick="playFilm()" style="width:100%;padding:10px;background:#facc15;border:none;border-radius:5px">TONTON SEKARANG</button><br><br><button onclick="tutup('modalBayar')">Tutup</button></div></div>
<div id="modalPlayer" class="modal"><div class="modal-box" style="max-width:800px;width:95%;position:relative;overflow:hidden">
<h3 id="judulPlayer"></h3>
<div style="position:relative;width:100%;height:400px;background:#000">
  <div id="videoLoader"><div class="farel-spinner" style="width:70px;height:70px"></div><div class="farel-text" style="font-size:13px">FARELFLIX</div></div>
  <video id="myVideo" controls style="width:100%;height:100%;display:none"></video><iframe id="myIframe" style="width:100%;height:100%;display:none" allowfullscreen></iframe>
</div><br><button onclick="tutupPlayer()">Tutup</button></div></div>
<div id="modalLogout" class="modal"><div class="modal-box"><p>Yakin logout?</p><button onclick="konfirmasiLogout()">Ya</button> <button onclick="tutup('modalLogout')">Batal</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, setDoc, collection, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU", authDomain: "farel-flix-tambala.firebaseapp.com", projectId: "farel-flix-tambala", storageBucket: "farel-flix-tambala.firebasestorage.app", messagingSenderId: "265996924707", appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const EMAIL_ADMIN = "farelinokolondam50@gmail.com";
let currentUserDoc = null;
let userListCache = [];
let liveTimer = null;
let heartbeatTimer = null;

function waktuLalu(date){
  if(!date) return "-";
  const diff = Math.floor((new Date() - date)/1000);
  if(diff < 5) return "baru saja";
  if(diff < 60) return diff+" detik lalu";
  if(diff < 3600) return Math.floor(diff/60)+" menit lalu";
  if(diff < 86400) return Math.floor(diff/3600)+" jam lalu";
  return Math.floor(diff/86400)+" hari lalu";
}

function getDeviceAndMedia(){
  const ua = navigator.userAgent;
  let model = "";
  const androidM = ua.match(/Android.*?;\s*([^;\)]+)\s*Build/i);
  if(androidM) model = androidM[1].trim();
  else if(/iPhone/i.test(ua)) model = "iPhone";
  else if(/iPad/i.test(ua)) model = "iPad";

  let device = "💻 Desktop";
  if(/Android/i.test(ua)) device = "📱 " + (model || "Android Phone");
  else if(/iPhone/i.test(ua)) device = "📱 " + model;
  else if(/iPad/i.test(ua)) device = "📱 iPad";

  let browser = "Browser";
  if(ua.includes("Chrome") &&!ua.includes("Edg")) browser = "Chrome";
  else if(ua.includes("Firefox")) browser = "Firefox";
  else if(ua.includes("Safari") &&!ua.includes("Chrome")) browser = "Safari";
  else if(ua.includes("Edg")) browser = "Edge";

  let os = "";
  if(ua.includes("Android")) os = "Android";
  else if(ua.includes("Windows")) os = "Windows";
  else if(ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
  else if(ua.includes("Mac")) os = "MacOS";

  let ref = document.referrer || "";
  let media = "Langsung";
  if(ref.includes("facebook.com") || ref.includes("fb.com")) media = "Facebook";
  else if(ref.includes("instagram.com")) media = "Instagram";
  else if(ref.includes("google.com")) media = "Google";
  else if(ref.includes("whatsapp") || ref.includes("wa.me")) media = "WhatsApp";
  else if(ref.includes("t.me")) media = "Telegram";
  else if(ref!== "") { try{ media = new URL(ref).hostname; }catch(e){ media = ref; } }

  return { fullText: `${device} - ${os} - ${browser}`, model: model || "Desktop", browser: browser, os: os, media: media, ref: ref, situs: window.location.hostname };
}

onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href="login.html"; }
  else {
    document.getElementById("userEmail").innerText=user.email;
    document.getElementById("loadingScreen").style.display="none";
    currentUserDoc = doc(db, "users_log", user.uid);

    let loginVia = "Email/Password";
    if(user.providerData && user.providerData[0]){
      const p = user.providerData[0].providerId;
      if(p === "google.com") loginVia = "🔵 Google";
      else if(p === "facebook.com") loginVia = "🔵 Facebook";
      else if(p === "password") loginVia = "📧 Email/Password";
      else if(p === "phone") loginVia = "📱 No HP";
      else loginVia = p;
    }

    const dev = getDeviceAndMedia();

    try{
      await setDoc(currentUserDoc, {
        email: user.email,
        lastLogin: serverTimestamp(),
        lastActive: serverTimestamp(),
        isOnline: true,
        uid: user.uid,
        loginVia: loginVia,
        device: dev.fullText,
        hp_model: dev.model,
        browser: dev.browser,
        os: dev.os,
        situs_login: dev.situs,
        datang_dari_media: dev.media,
        referrer_link: dev.ref || "-"
      }, {merge:true});
      if(heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(()=>{ setDoc(currentUserDoc, { lastActive: serverTimestamp(), isOnline: true }, {merge:true}); }, 10000);
    }catch(e){ console.log(e); }

    onSnapshot(collection(db, "users_log"), (snap)=>{
      let online = 0;
      userListCache = [];
      snap.forEach(d=>{
        const u=d.data();
        const diff = u.lastActive?.toDate? Math.floor((new Date() - u.lastActive.toDate())/1000) : 9999;
        if(u.isOnline && diff < 120) online++;
        userListCache.push(u);
      });
      const s1 = document.getElementById("statUserCount");
      const s2 = document.getElementById("statOnlineCount");
      if(s1) s1.innerText = snap.size;
      if(s2) s2.innerText = online;
      if(document.getElementById("modalUsers").style.display=="flex") renderUserList();
    });

    if(user.email.toLowerCase() === EMAIL_ADMIN.toLowerCase()){
      document.getElementById("btnAdmin").style.display="inline-block";
      document.getElementById("btnUsers").style.display="inline-block";
      window.isAdmin = true;
      document.getElementById("adminDashboard").style.display="flex";
    } else { window.isAdmin = false; }
    if(window.renderFilm && window.dataFilm){ window.renderFilm(window.dataFilm); }
  }
});

function renderUserList(){
  const list = document.getElementById("listUsers");
  if(!userListCache.length){ list.innerHTML="Belum ada user"; return; }
  userListCache.sort((a,b)=> (b.lastActive?.seconds||0) - (a.lastActive?.seconds||0));
  let html = `<table style="width:100%;border-collapse:collapse"><tr style="background:#333"><th style="padding:8px;text-align:left">Email / Login Via</th><th style="padding:8px">Status</th><th style="padding:8px">Device & Asal</th></tr>`;
  userListCache.forEach(u=>{
    const d = u.lastActive?.toDate? u.lastActive.toDate() : (u.lastLogin?.toDate? u.lastLogin.toDate() : null);
    const tgl = d? d.toLocaleString('id-ID') : 'Baru';
    const diff = d? Math.floor((new Date() - d)/1000) : 99999;
    const beneranOnline = u.isOnline && diff < 120;
    const status = beneranOnline? '<b style="color:#00ff88">● ONLINE</b>' : '<span style="color:#888">○ OFFLINE</span>';
    const lalu = beneranOnline? '<b style="color:#00ff88">Aktif sekarang</b><br><span style="font-size:10px">'+waktuLalu(d)+'</span>' : '<span style="color:#00d1ff">'+waktuLalu(d)+'</span>';
    const deviceInfo = `${u.device || "-"}<br><span style="color:#facc15">Model: ${u.hp_model || "-"}</span><br><span style="font-size:9px;color:#aaa">Situs: ${u.situs_login || "-"} | Dari: ${u.datang_dari_media || "-"}</span>`;
    html+=`<tr style="border-bottom:1px solid #333"><td style="padding:8px">${u.email}<br><b style="color:#00d1ff">${u.loginVia || "Email"}</b><br><span style="font-size:10px;color:#aaa">${tgl}</span></td><td style="padding:8px;text-align:center">${status}<br><span style="font-size:10px">${lalu}</span></td><td style="padding:8px;font-size:10px">${deviceInfo}</td></tr>`;
  });
  html+=`</table>`;
  list.innerHTML=html;
}

window.bukaUsers = ()=>{
  document.getElementById("modalUsers").style.display="flex";
  renderUserList();
  if(liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(()=>{ renderUserList(); }, 1000);
}
window.logout = ()=>{ document.getElementById("modalLogout").style.display="flex"; }
window.konfirmasiLogout = async ()=>{
  try{ if(currentUserDoc){ await setDoc(currentUserDoc, { isOnline: false, lastActive: serverTimestamp() }, {merge:true}); } }catch(e){}
  if(liveTimer) clearInterval(liveTimer);
  if(heartbeatTimer) clearInterval(heartbeatTimer);
  signOut(auth).then(()=>{ window.location.href="login.html"; });
}
window.tutup = (id)=>{
  document.getElementById(id).style.display="none";
  if(id=='modalUsers' && liveTimer){ clearInterval(liveTimer); liveTimer=null; }
}
</script>
<script>
const saved = localStorage.getItem("farelFilm");
window.dataFilm = saved? JSON.parse(saved) : {
  "ACTION":[
    {judul:"DIE HARD",file:"https://drive.google.com/file/d/15HSk3mEn9UDUP372LikPRNNod3W1oRsR/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/diehard2023.jpg"},
    {judul:"JOHN WICK 3",file:"https://drive.google.com/file/d/1LP1fanmcoKYm5wQaD4zLnxXwm4rLh41V/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/John_Wick_Chapter_3_Parabellum.png"},
    {judul:"TERMINATOR DARK FATE",file:"https://drive.google.com/file/d/1QikQrqaFpwpd80it7B7YA0AlpnqvlyXW/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/terminator%20dark%20fate.jpg"}
  ],
  "TERBARU":[{judul:"JOHN WICK 4",file:"https://drive.google.com/file/d/1KgoY2XGeEvY4TKY10CU0vkWARyMfrfVV/preview",type:"drive",gambar:"https://farel-flix-tambala.web.app/gambar/johnwick4.webp"}]
};
let aktifFile="",aktifType="";
window.isAdmin = false;
const container=document.getElementById("semuaKategori");
window.renderFilm = function(data){
  container.innerHTML=""; let ada=false; let totalFilm=0; let katCount = 0;
  for(let kat in data){
    if(!data[kat]||data[kat].length==0) continue;
    ada=true; katCount++; totalFilm+=data[kat].length;
    let html=`<div class="kategori"><h2>${kat}</h2><div class="row">`;
    data[kat].forEach((f, idx)=>{
      html+=`<div class="card ${window.isAdmin?'admin':''}" onclick="buka('${f.judul.replace(/'/g,"\\'")}','${f.file}','${f.type}')"><div class="imgBox"><img src="${f.gambar}" onerror="this.src='https://via.placeholder.com/140x210?text=${encodeURIComponent(f.judul)}'"><button class="btnHapus" onclick="event.stopPropagation(); hapusFilm('${kat}',${idx})">×</button></div><p>${f.judul}</p></div>`;
    });
    html+=`</div></div>`;
    container.innerHTML+=html;
  }
  document.getElementById("noResult").style.display=ada?"none":"block";
  document.getElementById("statFilm").innerText = totalFilm;
  document.getElementById("statKat").innerText = katCount;
}
window.hapusFilm = function(kat, idx){
  if(!confirm("Hapus film "+window.dataFilm[kat][idx].judul+"?")) return;
  window.dataFilm[kat].splice(idx,1);
  if(window.dataFilm[kat].length===0) delete window.dataFilm[kat];
  localStorage.setItem("farelFilm", JSON.stringify(window.dataFilm));
  window.renderFilm(window.dataFilm);
}
window.addEventListener("DOMContentLoaded",()=>{
  setTimeout(()=>{
    window.renderFilm(window.dataFilm);
    document.getElementById("loadingScreen").style.display="none";
  },500);
});
function bukaAdmin(){ document.getElementById("modalAdmin").style.display="flex"; }
function simpanFilmAdmin(){
  let kat=document.getElementById("adminKategori").value.toUpperCase().trim();
  let judul=document.getElementById("adminJudul").value.trim();
  let file=document.getElementById("adminFile").value.trim();
  let gambar=document.getElementById("adminGambar").value.trim();
  if(!kat||!judul||!file){ alert("Isi kategori, judul, file!"); return; }
  if(!window.dataFilm[kat]) window.dataFilm[kat]=[];
  window.dataFilm[kat].push({judul,file,type:"drive",gambar:gambar||"https://via.placeholder.com/140x210?text="+encodeURIComponent(judul)});
  localStorage.setItem("farelFilm", JSON.stringify(window.dataFilm));
  window.renderFilm(window.dataFilm);
  tutup('modalAdmin');
  document.getElementById("adminKategori").value=""; document.getElementById("adminJudul").value=""; document.getElementById("adminFile").value=""; document.getElementById("adminGambar").value="";
  alert("Berhasil tambah "+judul);
}
function goHome(){document.getElementById("searchBox").value="";window.renderFilm(window.dataFilm);}
function filterKategori(kat){ if(kat==='all'){window.renderFilm(window.dataFilm);return;} let f={}; if(window.dataFilm[kat]) f[kat]=window.dataFilm[kat]; window.renderFilm(f); }
function cariFilm(){ let q=document.getElementById("searchBox").value.toLowerCase(); if(!q){window.renderFilm(window.dataFilm);return;} let h={}; for(let kat in window.dataFilm){ let c=window.dataFilm[kat].filter(x=>x.judul.toLowerCase().includes(q)); if(c.length>0)h[kat]=c; } window.renderFilm(h); }
function buka(j,f,t){ aktifFile=f;aktifType=t; document.getElementById("judulBayar").innerText=j; document.getElementById("judulPlayer").innerText=j; document.getElementById("modalBayar").style.display="flex"; }
function playFilm(){
  document.getElementById("modalBayar").style.display="none"; document.getElementById("modalPlayer").style.display="flex";
  let v=document.getElementById("myVideo"); let i=document.getElementById("myIframe"); let loader=document.getElementById("videoLoader");
  loader.style.display="flex";
  if(aktifType=="drive"){ v.style.display="none"; v.pause(); i.style.display="block"; i.src=aktifFile; i.onload=()=>{loader.style.display="none"}; setTimeout(()=>{loader.style.display="none"},2500); }
  else { i.style.display="none"; i.src=""; v.style.display="block"; v.src=aktifFile; v.play(); v.onplaying=()=>{loader.style.display="none"}; }
}
