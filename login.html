<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX - Masuk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#000;overflow:hidden}
.bg-netflix{position:fixed;inset:0;background:linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.9) 100%), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070') center/cover;filter:brightness(0.6)}
.netflix-logo{color:#E50914;letter-spacing:-1px}
.input-netflix{background:rgba(22,22,22,0.9);border:1px solid rgba(255,255,255,0.2);transition:all 0.2s}
.input-netflix:focus{border-color:white;background:rgba(35,35,35,0.95);outline:none}
.btn-netflix{background:#E50914;transition:all 0.3s}
.btn-netflix:hover{background:#F40612;transform:scale(1.01)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
</style>
</head>
<body class="min-h-screen flex flex-col">
<div class="bg-netflix"></div>
<div class="relative z-10 p-6 md:p-8 flex justify-between items-center"><h1 class="text-[28px] md:text-[34px] font-black" style="color:#E50914">FARELFLIX</h1></div>
<div class="relative z-10 flex-1 flex items-center justify-center px-4 pb-20">
  <div class="w-full max-w-[450px] bg-black/75 backdrop-blur-md rounded-md p-[28px] md:p-[48px] border border-white/10">
    <h2 class="text-[32px] font-bold text-white mb-7">Masuk</h2>
    <form id="manualForm" class="space-y-4">
      <input id="email" type="email" placeholder="Email atau nomor telepon" required class="input-netflix w-full px-4 py-[14px] rounded-[4px] text-white placeholder:text-white/60 text-[16px]">
      <input id="password" type="password" placeholder="Kata sandi" required class="input-netflix w-full px-4 py-[14px] rounded-[4px] text-white placeholder:text-white/60 text-[16px]">
      <p id="errorMsg" class="text-[#E50914] text-[13px] mt-2 hidden"></p>
      <button id="btnManual" type="submit" class="btn-netflix w-full py-[12px] rounded-[4px] text-white font-bold text-[16px] mt-2 flex items-center justify-center gap-2"><span id="btnManualText">Masuk</span></button>
    </form>
    <div class="flex items-center gap-3 my-6"><div class="h-[1px] flex-1 bg-white/20"></div><span class="text-white/50 text-[14px]">ATAU</span><div class="h-[1px] flex-1 bg-white/20"></div></div>
    <button id="btnGoogle" class="w-full bg-white py-[12px] rounded-[4px] text-black font-medium text-[15px] flex items-center justify-center gap-3 hover:bg-gray-200 transition"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"><span id="btnGoogleText">Masuk dengan Google</span></button>
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col items-center justify-center"><div class="w-12 h-12 border-4 border-[#E50914]/30 border-t-[#E50914] rounded-full animate-[spin_1s_linear_infinite] mb-4"></div><p class="text-white font-bold tracking-widest animate-pulse">FARELFLIX</p></div>
  </div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96",
  measurementId: "G-8LJKB2W9WB"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const btnManual = document.getElementById('btnManual');
const btnManualText = document.getElementById('btnManualText');
const btnGoogle = document.getElementById('btnGoogle');
const btnGoogleText = document.getElementById('btnGoogleText');
const errorMsg = document.getElementById('errorMsg');
const loadingOverlay = document.getElementById('loadingOverlay');
function showLoading(btn, textEl){ textEl.innerHTML = '<span class="spinner"></span> Memuat...'; btn.disabled = true; btn.style.opacity="0.7"; }
function hideLoading(btn, textEl, txt){ textEl.innerHTML = txt; btn.disabled = false; btn.style.opacity="1"; }
function successAnim(){ loadingOverlay.classList.remove('hidden'); setTimeout(()=>{ window.location.href = "index.html"; }, 900); }
document.getElementById('manualForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  errorMsg.classList.add('hidden');
  showLoading(btnManual, btnManualText);
  try{ await auth.signInWithEmailAndPassword(email, password); successAnim(); }catch(err){ hideLoading(btnManual, btnManualText, 'Masuk'); errorMsg.textContent = err.code==='auth/invalid-credential'? 'Email atau kata sandi salah.' : err.message; errorMsg.classList.remove('hidden'); }
});
btnGoogle.addEventListener('click', async ()=>{
  errorMsg.classList.add('hidden');
  showLoading(btnGoogle, btnGoogleText);
  try{ const provider = new firebase.auth.GoogleAuthProvider(); await auth.signInWithPopup(provider); successAnim(); }catch(err){ hideLoading(btnGoogle, btnGoogleText, 'Masuk dengan Google'); if(err.code!=='auth/popup-closed-by-user') { errorMsg.textContent = err.message; errorMsg.classList.remove('hidden'); } }
});
</script>
</body>
</html>
