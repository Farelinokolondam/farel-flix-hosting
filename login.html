<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
  height:100vh;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;
  background: linear-gradient(-45deg,#000,#141414,#1a0000,#000);
  background-size:400% 400%;
  animation: gradientMove 8s ease infinite;
}
@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
/* bintang-bintang bergerak */
.stars{position:absolute;width:100%;height:100%;overflow:hidden;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation: starMove linear infinite;opacity:0.7}
@keyframes starMove{
  from{transform:translateY(100vh)}
  to{transform:translateY(-10vh)}
}

.container{position:relative;z-index:2;text-align:center;padding:20px;animation: fadeUp 1.2s ease}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}
h1{
  font-size:42px;color:#fff;font-weight:900;letter-spacing:2px;
  animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 10px #ff0000,0 0 20px #ff0000}
  to{text-shadow:0 0 20px #ff0000,0 0 40px #e50914,0 0 60px #e50914}
}
p{color:#aaa;margin:12px 0 30px;font-size:16px;animation: fadeIn 2s ease 0.5s both}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}

.btn-login{
  background:#fff;color:#000;border:none;padding:16px 32px;border-radius:30px;
  font-weight:bold;font-size:16px;cursor:pointer;width:280px;max-width:90vw;
  transition:0.3s;
  animation: pulse 2s infinite;
  box-shadow:0 0 rgba(255,255,255,0.4);
}
@keyframes pulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,0.7)}
  70%{transform:scale(1.05);box-shadow:0 0 0 15px rgba(255,255,255,0)}
  100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,0)}
}
.btn-login:hover{background:#e50914;color:#fff;transform:scale(1.08)}
.logo-sub{color:#e50914;font-size:12px;letter-spacing:4px;margin-bottom:8px;display:block;animation: slideDown 1s ease}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0} to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <span class="logo-sub">TAMBALA</span>
  <h1>FAREL FLIX</h1>
  <p>Login untuk nonton film gratis</p>
  <button class="btn-login" id="btnLogin">Login dengan Gmail</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth,(user)=>{ if(user){ window.location.href="index.html"; } });

document.getElementById("btnLogin").onclick = ()=>{
  signInWithPopup(auth,provider).then(()=>{ window.location.href="index.html"; })
  .catch(e=>{ alert(e.message); });
};

// bikin bintang bergerak
const starsBox=document.getElementById("stars");
for(let i=0;i<40;i++){
  let s=document.createElement("div");s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.animationDuration=(Math.random()*5+5)+"s";
  s.style.animationDelay=Math.random()*5+"s";
  starsBox.appendChild(s);
}
</script>
</body>
</html>
