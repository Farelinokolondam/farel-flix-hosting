<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#000;font-family:'Segoe UI',Arial;display:flex;justify-content:center;align-items:center}
.wall{position:fixed;inset:0;z-index:0;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;transform:rotate(-5deg) scale(1.2);opacity:0.65;filter:blur(6px) brightness(1.1)}
.wall div{height:180px;background-size:cover;background-position:center;border-radius:4px}
.bg-dark{position:fixed;inset:0;z-index:1;background:linear-gradient(0deg,#000 0%,rgba(0,0,0,0.4) 50%,rgba(0,0,0,0.6) 100%),radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.6) 90%)}
.particles{position:fixed;inset:0;z-index:2;pointer-events:none}
.p{position:absolute;width:3px;height:3px;background:#ff3300;border-radius:50%;box-shadow:0 0 10px #ff3300;animation:naik linear infinite}
@keyframes naik{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}100%{transform:translateY(-10vh) translateX(100px);opacity:0}}
.box{position:relative;z-index:20;width:95%;max-width:400px;padding:45px 32px;background:rgba(0,0,0,0.88);border:1px solid rgba(255,255,255,0.12);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,0.9);backdrop-filter:blur(20px);text-align:center}
.box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#e50914;border-radius:10px 10px 0 0}
.logo{font-size:40px;font-weight:900;letter-spacing:5px;color:#e50914}
.logo span{color:#fff}
.tagline{color:#aaa;font-size:13px;margin-top:10px}
#btnLogin{width:100%;padding:14px;background:#fff;color:#000;border:none;border-radius:4px;font-weight:bold;font-size:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;margin-top:20px;transition:0.2s}
#btnLogin:hover{transform:scale(1.02);background:#e5e5e5}
#btnLogin:disabled{opacity:0.7;cursor:not-allowed;transform:none}
#error{color:#ffb3b3;background:rgba(229,9,20,0.15);border:1px solid rgba(229,9,20,0.3);padding:10px;border-radius:4px;font-size:13px;margin-top:15px;display:none}
#error.show{display:block}
.footer{position:fixed;bottom:15px;right:20px;z-index:30;color:#aaa;font-size:11px;background:rgba(0,0,0,0.6);padding:7px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(8px)}
.spinner{width:18px;height:18px;border:3px solid rgba(0,0,0,0.2);border-top:3px solid #000;border-radius:50%;animation:puter 0.8s linear infinite;display:none}
#btnLogin.loading .spinner{display:block}
#btnLogin.loading .icon-google{display:none}
@keyframes puter{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* TAMBAHAN INPUT MANUAL */
.divider{margin:22px 0;border:none;border-top:1px solid rgba(255,255,255,0.15);position:relative}
.divider span{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:#0a0a0a;padding:0 12px;color:#666;font-size:11px}
.input-gmail{width:100%;padding:12px 14px;background:#111;border:1px solid #333;border-radius:4px;color:#fff;margin-top:10px;outline:none}
.input-gmail:focus{border-color:#e50914}
#btnManual{width:100%;padding:12px;background:#e50914;color:#fff;border:none;border-radius:4px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:12px;transition:0.2s}
#btnManual:hover{background:#b81d24}
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<div class="bg-dark"></div>
<div class="particles" id="particles"></div>
<div class="box">
  <h1 class="logo">FAREL<span>FLIX</span></h1>
  <div class="tagline">Nonton Film Bioskop Gratis Tanpa Iklan</div>
  
  <button id="btnLogin">
    <div class="spinner"></div>
    <img class="icon-google" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> 
    <span id="btnText">Login dengan Google</span>
  </button>

  <div class="divider"><span>ATAU LOGIN MANUAL</span></div>

  <input id="emailManual" class="input-gmail" type="email" placeholder="Email Gmail">
  <input id="passManual" class="input-gmail" type="password" placeholder="Password">
  <button id="btnManual">LOGIN PAKAI PASSWORD</button>

  <div id="error"></div>
</div>
<div class="footer">© 2026 FARELFLIX </div>

<script>
const posters=["https://image.tmdb.org/t/p/w300/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg","https://image.tmdb.org/t/p/w300/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg","https://image.tmdb.org/t/p/w300/qW4crfED8mpNDadSmMdi7ZDzhXF.jpg","https://image.tmdb.org/t/p/w300/1E5baAaEse26fej7uHcjOgEE2t2.jpg","https://image.tmdb.org/t/p/w300/d5NXSklXo0qyIYkgV94XAgMIckC.jpg","https://image.tmdb.org/t/p/w300/6FfCtAuVAW8XJjZ7eWeLibRLWTw.jpg","https://image.tmdb.org/t/p/w300/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg","https://image.tmdb.org/t/p/w300/kDp1vUBnMpe8ak4rjgl3cLELqjU.jpg"];
const wall=document.getElementById('wall');
for(let i=0;i<24;i++){let d=document.createElement('div');d.style.backgroundImage=`url(${posters[i%posters.length]})`;wall.appendChild(d);}
for(let i=0;i<30;i++){const d=document.createElement('div');d.className='p';d.style.left=Math.random()*100+'vw';d.style.animationDuration=(5+Math.random()*8)+'s';d.style.animationDelay=Math.random()*5+'s';document.getElementById('particles').appendChild(d);}
</script>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
const btn=document.getElementById("btnLogin");
const btnText=document.getElementById("btnText");
const errBox=document.getElementById("error");
function gagalLogin(pesan){errBox.innerText=pesan || "Gagal login, coba lagi ya";errBox.classList.add("show");setTimeout(()=>{errBox.classList.remove("show");},4000);}

btn.onclick=async()=>{
  btn.disabled=true; btn.classList.add("loading"); btnText.innerText="Menghubungkan..."; errBox.classList.remove("show");
  try{
    const r=await signInWithPopup(auth,provider);
    if(!r.user?.email) throw new Error();
    btnText.innerText="Berhasil! Masuk...";
    setTimeout(()=>{ location.href="index.html"; },800);
  } catch(e){
    btn.disabled=false; btn.classList.remove("loading"); btnText.innerText="Login dengan Google";
    gagalLogin("Gagal login Google: "+e.code); console.log(e);
  }
};

// LOGIN MANUAL PAKAI PASSWORD YANG DIGANTI TADI
const btnManual=document.getElementById("btnManual");
btnManual.onclick=async()=>{
  const email=document.getElementById("emailManual").value.trim();
  const pass=document.getElementById("passManual").value.trim();
  if(!email || !pass){ gagalLogin("Isi email & password manual dulu!"); return; }
  btnManual.innerText="Memeriksa..."; btnManual.disabled=true;
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    btnManual.innerText="Berhasil! Masuk...";
    setTimeout(()=>{ location.href="index.html"; },800);
  }catch(e){
    btnManual.innerText="LOGIN PAKAI PASSWORD"; btnManual.disabled=false;
    if(e.code==="auth/wrong-password" || e.code==="auth/invalid-credential") gagalLogin("Password salah! Pakai password baru yang diganti tadi.");
    else if(e.code==="auth/user-not-found") gagalLogin("Email tidak terdaftar");
    else gagalLogin("Gagal: "+e.message);
  }
};
</script>
</body>
</html>
