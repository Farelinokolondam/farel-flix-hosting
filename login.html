<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX - GOLDEN DRAGON WAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:Arial}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,#2a1a05 0%,#000 70%);z-index:1}
.dragon-gold{position:fixed;top:5%;width:42%;max-width:550px;z-index:3;filter:drop-shadow(0 0 30px gold) drop-shadow(0 0 60px #ff4400);animation:float 3s ease-in-out infinite}
#dragon1{left:0%;animation:float1 3.2s ease-in-out infinite, war1 6s ease-in-out infinite}
#dragon2{right:0%;transform:scaleX(-1);animation:float2 3s ease-in-out infinite, war2 6s ease-in-out infinite;filter:drop-shadow(0 0 30px #ffaa00) drop-shadow(0 0 60px #ff4400) hue-rotate(180deg)}
@keyframes float1{0%,100%{top:5%}50%{top:9%}}
@keyframes float2{0%,100%{top:7%}50%{top:11%}}
@keyframes war1{0%,100%{left:0%}50%{left:8%}}
@keyframes war2{0%,100%{right:0%}50%{right:8%}}

.fire{position:fixed;top:22%;left:50%;width:0;height:0;z-index:4;pointer-events:none}
.fire-beam{position:absolute;width:180px;height:40px;background:linear-gradient(90deg,transparent,#ffff00,#ff6600,#ff0000);border-radius:20px;filter:blur(2px) drop-shadow(0 0 20px #ff4400);animation:beam 0.3s infinite alternate}
#fire1 .fire-beam{left:-180px;transform-origin:right;animation:shootLeft 0.5s linear infinite}
#fire2 .fire-beam{right:-180px;transform-origin:left;animation:shootRight 0.5s linear infinite;background:linear-gradient(270deg,transparent,#00ffff,#0066ff,#0000ff)}
@keyframes shootLeft{0%{transform:scaleX(0.3)}100%{transform:scaleX(1.5)}}
@keyframes shootRight{0%{transform:scaleX(0.3)}100%{transform:scaleX(1.5)}}
@keyframes beam{0%{opacity:0.8;filter:blur(2px)}100%{opacity:1;filter:blur(4px)}}
.explosion{position:fixed;top:25%;left:50%;transform:translateX(-50%);font-size:0px;z-index:5;animation:boom 6s infinite;pointer-events:none}
@keyframes boom{0%,44%,56%,100%{font-size:0;opacity:0}45%,55%{font-size:90px;opacity:1}}

.box{position:fixed;top:52%;left:50%;transform:translate(-50%,-50%);background:rgba(15,10,5,0.92);padding:35px 30px;border-radius:20px;text-align:center;width:360px;z-index:20;border:2px solid #ffaa0066;box-shadow:0 0 50px rgba(255,170,0,0.5), inset 0 0 20px rgba(255,170,0,0.1);backdrop-filter:blur(15px)}
.box h1{color:#ffcc00;margin:0;font-size:30px;letter-spacing:3px;text-shadow:0 0 15px gold}
.box p{color:#cc9900;font-size:13px;margin-top:5px}
#btnLogin{width:100%;padding:13px;background:linear-gradient(90deg,#ffcc00,#ff9900);color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:18px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 0 20px gold}
#btnLogin:hover{transform:scale(1.05)}
#error{color:#ff4444;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div id="bg"></div>

<!-- NAGA EMAS MODEL FOTO KAMU -->
<img id="dragon1" class="dragon-gold" src="naga-emas.png" alt="naga emas">
<img id="dragon2" class="dragon-gold" src="naga-emas.png" alt="naga emas biru">

<div id="fire1" class="fire"><div class="fire-beam"></div></div>
<div id="fire2" class="fire"><div class="fire-beam"></div></div>
<div class="explosion">💥</div>

<div class="box">
<h1>FAREL FLIX</h1>
<p>🐉 Golden Dragon War - Login 🐉</p>
<button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
<div id="error"></div>
<p style="font-size:10px;margin-top:10px;color:#ffaa00;letter-spacing:2px">NAGA EMAS PENJAGA</p>
</div>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Loading...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};
// api muncul tiap 2 detik
const f1=document.getElementById('fire1'), f2=document.getElementById('fire2');
setInterval(()=>{
  f1.style.opacity=1; f2.style.opacity=1;
  setTimeout(()=>{f1.style.opacity=0; f2.style.opacity=0;},600);
},2000);
</script>
</body>
</html>
