<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// Cek hasil redirect
getRedirectResult(auth).then((result) => {
  if(result) window.location.href = "index.html";
});

const btn = document.getElementById("google-login-btn"); // ganti id sesuai tombol kamu
const isFB = /FBAN|FBAV|FB_IAB|FB4A|Instagram|FBAN\/Messenger/.test(navigator.userAgent);

if(isFB){
  document.body.innerHTML = `
    <div style="padding:40px;text-align:center;font-family:sans-serif">
      <h2>⚠️ Gagal dibuka di Facebook Lite</h2>
      <p>Login Google tidak bisa di dalam Facebook. Klik titik 3 kanan atas, lalu pilih <b>Buka di browser eksternal / Open in Chrome</b></p>
      <br>
      <a href="https://farel-flix-hosting-m3c5.vercel.app/login.html" style="background:black;color:white;padding:12px 20px;border-radius:8px;text-decoration:none">Buka di Chrome</a>
      <p style="margin-top:20px;font-size:12px">Link: farel-flix-hosting-m3c5.vercel.app</p>
    </div>`;
} else {
  btn?.addEventListener("click", () => {
    signInWithPopup(auth, provider)
      .then(()=> window.location.href="index.html")
      .catch(()=> signInWithRedirect(auth, provider));
  });
}
</script>
