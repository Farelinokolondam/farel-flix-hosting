<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FAREL FLIX</title>
<style>
body{background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#111;padding:35px;border-radius:15px;width:320px;text-align:center;border:1px solid #222}
h1{color:#e50914;margin-bottom:10px}
button{background:#fff;color:#000;border:none;padding:13px;width:100%;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:20px;font-size:15px}
button:hover{background:#ddd}
#status{margin-top:15px;font-size:13px;color:#aaa}
</style>
</head>
<body>
<div class="box">
<h1>FAREL FLIX</h1>
<p>Login untuk nonton film</p>
<button id="btnGoogle">Login dengan Google</button>
<p id="status"></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96",
  measurementId: "G-8LJKB2W9WB"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
document.getElementById('btnGoogle').onclick = async () => {
  document.getElementById('status').innerText = "Membuka Google...";
  try {
    const result = await signInWithPopup(auth, provider);
    localStorage.setItem("farel_user", JSON.stringify({name: result.user.displayName, email: result.user.email}));
    document.getElementById('status').innerText = "Berhasil! Halo " + result.user.displayName;
    setTimeout(()=>{ window.location.href = "index.html"; }, 1200);
  } catch (e) {
    document.getElementById('status').innerText = e.message;
  }
};
</script>
</body>
</html>
