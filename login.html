<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Farel Flix</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-sm text-center">
  <h1 class="text-4xl font-bold">FAREL FLIX</h1>
  <p class="text-gray-400 mt-2 mb-10">Login untuk nonton film gratis</p>
  
  <button id="google-login-btn" class="w-full bg-white text-black py-3.5 rounded-full font-bold flex items-center justify-center gap-3 hover:bg-gray-200">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Login dengan Gmail
  </button>

  <p id="status" class="text-xs text-gray-500 mt-4"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

// Kalau sudah login, langsung ke index.html
onAuthStateChanged(auth, (user) => {
  if(user){
    window.location.href = "index.html";
  }
});

document.getElementById("google-login-btn").addEventListener("click", async () => {
  const btn = document.getElementById("google-login-btn");
  const status = document.getElementById("status");
  try{
    btn.innerText = "Loading...";
    status.innerText = "Buka popup Gmail...";
    const result = await signInWithPopup(auth, provider);
    status.innerText = "Berhasil: " + result.user.email;
    window.location.href = "index.html";
  } catch (e) {
    btn.innerHTML = '<img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Login dengan Gmail';
    status.innerText = "Gagal: " + e.message;
    alert("Login Gmail Gagal: " + e.message);
    console.log(e);
  }
});
</script>
</body>
</html>
