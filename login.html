<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX - Masuk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#000;overflow:hidden}

/* BACKGROUND SAMAR TAPI JELAS - LEBIH TERANG */
.bg-netflix{
  position:fixed;inset:0;
  background:
    linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.6), transparent),
    url('https://assets.nflxext.com/ffe/siteui/vlv3/9d3533b2-0e2b-40b2-95e0-ecd7979cc88b/web/ID-en-20240311-popsignuptwoweeks-perspective_alpha_website_large.jpg') center/cover;
  animation: zoomSlow 30s ease-in-out infinite alternate;
  filter: brightness(0.9) contrast(1.15) saturate(1.1);
}
@keyframes zoomSlow{0%{transform:scale(1)}100%{transform:scale(1.12)}}

/* ===== ANIMASI API NETFLIX DARI BAWAH ===== */
.fire-container{
  position:fixed;bottom:0;left:0;right:0;height:45%;pointer-events:none;z-index:2;overflow:hidden
}
.fire{
  position:absolute;bottom:-30px;width:120%;height:100%;
  background: radial-gradient(ellipse at bottom, rgba(229,9,20,0.4) 0%, rgba(255,69,0,0.2) 25%, transparent 70%);
  filter: blur(25px);
  animation: fireMove 4s ease-in-out infinite alternate;
}
.fire-2{
  position:absolute;bottom:-50px;width:140%;left:-20%;height:80%;
  background: radial-gradient(ellipse at bottom, rgba(255,140,0,0.25) 0%, rgba(250,204,21,0.15) 30%, transparent 60%);
  filter: blur(35px);
  animation: fireMove2 3.5s ease-in-out infinite alternate-reverse;
}
.fire-3{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background: linear-gradient(90deg, transparent, #E50914, #ff8c00, #facc15, transparent);
  box-shadow: 0 0 20px #E50914, 0 0 40px #ff8c00;
  animation: fireLine 2s linear infinite;
  opacity:0.8
}
@keyframes fireMove{
  0%{transform: translateX(-10%) scaleY(1) scaleX(1); opacity:0.6}
  100%{transform: translateX(10%) scaleY(1.3) scaleX(1.1); opacity:0.9}
}
@keyframes fireMove2{
  0%{transform: translateX(10%) scaleY(0.9); opacity:0.4}
  100%{transform: translateX(-15%) scaleY(1.2); opacity:0.7}
}
@keyframes fireLine{
  0%{transform: translateX(-100%)}
  100%{transform: translateX(100%)}
}

/* Logo Kuning */
.netflix-logo{color:#FACC15;letter-spacing:-1px;text-shadow:0 0 25px rgba(250,204,21,0.7), 0 0 50px rgba(229,9,20,0.4)}

.input-netflix{background:rgba(22,22,22,0.85);border:1px solid rgba(255,255,255,0.25);transition:all 0.2s;backdrop-filter:blur(5px)}
.input-netflix:focus{border-color:#FACC15;background:rgba(35,35,35,0.95);box-shadow:0 0 10px rgba(250,204,21,0.2);outline:none}
.input-netflix.error{border-color:#E50914!important;background:rgba(229,9,20,0.1)}
.btn-netflix{background:#E50914;transition:all 0.3s;box-shadow:0 0 25px rgba(229,9,20,0.4)}
.btn-netflix:hover{background:#F40612;transform:scale(1.02);box-shadow:0 0 35px rgba(229,9,20,0.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake 0.3s ease-in-out}
@keyframes ping-slow{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.5);opacity:0}}
</style>
</head>
<body class="min-h-screen flex flex-col">
<div class="bg-netflix"></div>

<!-- API DARI BAWAH -->
<div class="fire-container">
  <div class="fire"></div>
  <div class="fire-2"></div>
  <div class="fire-3"></div>
</div>

<div class="relative z-10 p-6 md:p-8 flex justify-between items-center">
  <h1 class="text-[28px] md:text-[34px] font-black netflix-logo">FARELFLIX</h1>
</div>

<div class="relative z-10 flex-1 flex items-center justify-center px-4 pb-20">
  <div class="w-full max-w-[450px] bg-black/70 backdrop-blur-xl rounded-md p-[28px] md:p-[48px] border border-white/15 shadow-[0_0_100px_rgba(0,0,0,0.9),0_0_30px_rgba(250,204,21,0.1)]">
    <h2 class="text-[32px] font-bold text-white mb-7 drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">Masuk</h2>
    <form id="manualForm" class="space-y-4">
      <div id="errorGeneral" class="hidden bg-[#E50914]/20 border border-[#E50914]/50 text-white p-3 rounded-[4px] text-[14px] font-medium flex items-center gap-2">
        <span class="text-[#E50914] text-[18px]">ⓧ</span> Login gagal, silakan coba lagi
      </div>
      <input id="email" type="email" placeholder="Email atau nomor telepon" required class="input-netflix w-full px-4 py-[14px] rounded-[4px] text-white placeholder:text-white/60 text-[16px]">
      <div class="space-y-1">
        <p id="errorPassword" class="hidden text-[#E50914] text-[13px] font-medium flex items-center gap-1 mb-1">
          <span>ⓧ</span> Password salah, silakan coba lagi
        </p>
        <input id="password" type="password" placeholder="Kata sandi" required class="input-netflix w-full px-4 py-[14px] rounded-[4px] text-white placeholder:text-white/60 text-[16px]">
      </div>
      <p id="errorMsg" class="text-[#E50914] text-[13px] hidden"></p>
      <button id="btnManual" type="submit" class="btn-netflix w-full py-[12px] rounded-[4px] text-white font-bold text-[16px] mt-2 flex items-center justify-center gap-2"><span id="btnManualText">Masuk</span></button>
    </form>
    <div class="flex items-center gap-3 my-6"><div class="h-[1px] flex-1 bg-white/20"></div><span class="text-white/50 text-[14px]">ATAU</span><div class="h-[1px] flex-1 bg-white/20"></div></div>
    <button id="btnGoogle" class="w-full bg-white py-[12px] rounded-[4px] text-black font-medium text-[15px] flex items-center justify-center gap-3 hover:bg-gray-200 transition"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"><span id="btnGoogleText">Masuk dengan Google</span></button>
  </div>
</div>

<!-- LOADING KUNING -->
<div id="loadingOverlay" class="hidden fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center">
  <div class="relative">
    <div class="w-[70px] h-[70px] rounded-full border-[4px] border-white/10"></div>
    <div class="absolute inset-0 w-[70px] h-[70px] rounded-full border-[4px] border-transparent border-t-yellow-400 border-r-amber-400 animate-[spin_0.9s_linear_infinite] shadow-[0_0_20px_rgba(250,204,21,0.5)]"></div>
    <div class="absolute inset-0 w-[70px] h-[70px] rounded-full bg-yellow-400/30 blur-[14px] -z-10 animate-[ping-slow_1.5s_ease-out_infinite]"></div>
  </div>
  <div class="mt-8 flex flex-col items-center">
    <p class="text-yellow-400 font-black text-[24px] tracking-[0.25em] animate-pulse drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]">FARELFLIX</p>
    <div class="flex gap-1 mt-3">
      <span class="w-2 h-2 bg-yellow-400 rounded-full animate-bounce"></span>
      <span class="w-2 h-2 bg-yellow-400 rounded-full animate-bounce" style="animation-delay:0.1s"></span>
      <span class="w-2 h-2 bg-yellow-400 rounded-full animate-bounce" style="animation-delay:0.2s"></span>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96",
  measurementId: "G-8LJKB2W9WB"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const btnManual = document.getElementById('btnManual');
const btnManualText = document.getElementById('btnManualText');
const btnGoogle = document.getElementById('btnGoogle');
const btnGoogleText = document.getElementById('btnGoogleText');
const errorMsg = document.getElementById('errorMsg');
const errorGeneral = document.getElementById('errorGeneral');
const errorPassword = document.getElementById('errorPassword');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loadingOverlay = document.getElementById('loadingOverlay');
function showLoading(btn, textEl){ textEl.innerHTML = '<span class="spinner"></span> Memuat...'; btn.disabled = true; btn.style.opacity="0.7"; }
function hideLoading(btn, textEl, txt){ textEl.innerHTML = txt; btn.disabled = false; btn.style.opacity="1"; }
function successAnim(){ loadingOverlay.classList.remove('hidden'); setTimeout(()=>{ window.location.href = "index.html"; }, 1500); }
function resetErrors(){
  errorGeneral.classList.add('hidden');
  errorPassword.classList.add('hidden');
  errorMsg.classList.add('hidden');
  emailInput.classList.remove('error','shake');
  passwordInput.classList.remove('error','shake');
}
emailInput.addEventListener('input', resetErrors);
passwordInput.addEventListener('input', resetErrors);
document.getElementById('manualForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  resetErrors();
  showLoading(btnManual, btnManualText);
  try{
    await auth.signInWithEmailAndPassword(email, password);
    successAnim();
  }catch(err){
    hideLoading(btnManual, btnManualText, 'Masuk');
    if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials'){
      errorPassword.classList.remove('hidden');
      passwordInput.classList.add('error','shake');
      passwordInput.focus();
    } else {
      errorGeneral.classList.remove('hidden');
      emailInput.classList.add('error','shake');
    }
  }
});
btnGoogle.addEventListener('click', async ()=>{
  resetErrors();
  showLoading(btnGoogle, btnGoogleText);
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    successAnim();
  }catch(err){
    hideLoading(btnGoogle, btnGoogleText, 'Masuk dengan Google');
    if(err.code!== 'auth/popup-closed-by-user') {
      errorGeneral.classList.remove('hidden');
    }
  }
});
</script>
</body>
</html>
