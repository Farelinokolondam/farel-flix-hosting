<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX - NAGA MELINGKAR REAL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050300;height:100vh;overflow:hidden;font-family:Arial;display:flex;justify-content:center;align-items:center}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(at center,#241a00 0%,#000 75%);z-index:1}

.wrap{position:relative;z-index:10;width:700px;height:700px;display:flex;justify-content:center;align-items:center}

/* NAGA GEDE MELINGKAR */
.naga{
  position:absolute;
  width:680px;
  height:680px;
  object-fit:contain;
  z-index:1;
  filter:drop-shadow(0 0 25px gold) drop-shadow(0 0 60px #ff5500);
  animation:nafas 2.5s ease-in-out infinite;
}
@keyframes nafas{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* BOX DI TENGAH LINGKARAN NAGA - PAS DI MULUT API */
.box{
  position:relative;
  z-index:10;
  background:rgba(12,9,4,0.96);
  padding:30px 28px;
  border-radius:20px;
  width:340px;
  text-align:center;
  border:2px solid #ffcc33;
  box-shadow:0 0 50px rgba(255,200,0,0.8), inset 0 0 20px rgba(255,200,0,0.2);
  margin-top:40px;
}
.box h1{color:#ffcc00;margin:0;font-size:29px;letter-spacing:3px;text-shadow:0 0 15px gold}
.box p{color:#d4a017;font-size:12px}
#btnLogin{width:100%;padding:12px;background:linear-gradient(90deg,#ffcc00,#ff8800);color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:15px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 0 20px gold}
#btnLogin:hover{transform:scale(1.05)}
#error{color:#ff4444;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div id="bg"></div>

<div class="wrap">
  <img class="naga" src="naga-melingkar-transparan.png" alt="naga emas">
  
  <div class="box">
    <h1>FAREL FLIX</h1>
    <p>🐉 Naga Emas Penjaga 🐉</p>
    <button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
    <div id="error"></div>
    <p style="font-size:9px;color:#ffaa00;margin-top:10px;letter-spacing:3px">MASUK KE SARANG NAGA</p>
  </div>
</div>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Loading...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};
</script>
</body>
</html>
