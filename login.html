<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FARELFLIX</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#1a1a1a;padding:30px;border-radius:12px;text-align:center;width:320px;box-shadow:0 0 20px rgba(255,69,0,0.3)}
h1{color:#ff8c00;margin:0 0 10px}
button{width:100%;padding:12px;background:#fff;color:#000;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:15px;display:flex;align-items:center;justify-content:center;gap:8px}
button:hover{background:#eee}
#error{color:#ff4444;font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <h1>FAREL FLIX</h1>
  <p style="font-size:14px;color:#aaa">Login untuk nonton film</p>
  <button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
  <div id="error"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, (user)=>{
  if(user){ window.location.href="index.html"; }
});

document.getElementById("btnLogin").addEventListener("click", async()=>{
  const errBox = document.getElementById("error");
  errBox.innerText = "";
  try{
    await signInWithPopup(auth, provider);
    window.location.href="index.html";
  }catch(e){
    console.error(e);
    errBox.innerText = e.message;
  }
});
</script>
</body>
</html>
