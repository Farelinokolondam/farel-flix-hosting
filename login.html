<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX - NAGA MELINGKAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:Arial;display:flex;justify-content:center;align-items:center}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(at center,#1a1200,#000);z-index:1}

/* NAGA BESAR MELINGKAR DI LOGIN */
.dragon-wrap{position:relative;z-index:10;width:520px;height:520px;display:flex;justify-content:center;align-items:center}
.dragon-img{position:absolute;width:125%;height:125%;object-fit:contain;z-index:1;animation:putarPelan 20s linear infinite, napas 2s ease-in-out infinite;filter:drop-shadow(0 0 40px gold) drop-shadow(0 0 80px #ff4400)}
@keyframes putarPelan{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes napas{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(0deg) scale(1.05)}}

/* API DARI MULUT NAGA */
.api{position:absolute;top:28%;left:50%;transform:translateX(-50%);width:10px;height:200px;z-index:2;pointer-events:none}
.api-inner{width:100%;height:100%;background:linear-gradient(to bottom,#ffff99,#ffcc00,#ff6600,#ff0000,transparent);filter:blur(3px);border-radius:50%;animation:apiMenyala 0.2s infinite alternate;box-shadow:0 0 30px #ff4400,0 0 60px gold}
@keyframes apiMenyala{0%{opacity:0.8;transform:scaleX(1)}100%{opacity:1;transform:scaleX(1.8)}}
.partikel{position:absolute;width:6px;height:6px;background:#ffcc00;border-radius:50%;animation:jatuh 1s linear infinite}
@keyframes jatuh{0%{transform:translateY(0) translateX(0);opacity:1}100%{transform:translateY(180px) translateX(var(--x));opacity:0}}

.box{position:absolute;z-index:5;background:rgba(10,8,5,0.96);padding:30px 28px;border-radius:20px;width:340px;text-align:center;border:2px solid #ffcc0066;box-shadow:0 0 60px rgba(255,200,0,0.6), inset 0 0 30px rgba(255,200,0,0.15);backdrop-filter:blur(12px)}
.box h1{color:#ffcc00;margin:0;font-size:28px;letter-spacing:3px;text-shadow:0 0 20px gold}
.box p{color:#cc9900;font-size:12px;margin-top:4px}
#btnLogin{width:100%;padding:12px;background:linear-gradient(90deg,#ffcc00,#ff8800);color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:16px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 0 25px gold}
#btnLogin:hover{transform:scale(1.05)}
#error{color:#ff4444;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div id="bg"></div>

<div class="dragon-wrap">
  <img class="dragon-img" src="naga-melingkar.png" alt="naga emas melingkar">
  <div class="api"><div class="api-inner"></div></div>
  <!-- partikel api -->
  <div class="partikel" style="--x:10px;left:49%;top:38%;animation-delay:0s"></div>
  <div class="partikel" style="--x:-15px;left:51%;top:42%;animation-delay:0.2s"></div>
  <div class="partikel" style="--x:20px;left:50%;top:45%;animation-delay:0.4s"></div>
  
  <div class="box">
    <h1>FAREL FLIX</h1>
    <p>🐉 Naga Emas Penjaga 🐉</p>
    <button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
    <div id="error"></div>
    <p style="font-size:9px;color:#ffaa00;margin-top:12px;letter-spacing:3px">MASUK KE SARANG NAGA</p>
  </div>
</div>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Loading...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};
</script>
</body>
</html>
