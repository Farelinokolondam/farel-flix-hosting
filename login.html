<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FAREL FLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial, sans-serif;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate}
@keyframes twinkle{0%{opacity:0.2}100%{opacity:1}}

/* BOX LOGIN */
.box{background:rgba(26,26,26,0.9);padding:35px;border-radius:16px;text-align:center;width:340px;backdrop-filter:blur(10px);border:1px solid #333;box-shadow:0 0 30px rgba(255,140,0,0.3);z-index:10;animation:pop 0.8s ease}
@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.box h1{color:#ff8c00;margin:0;letter-spacing:2px;font-size:28px;text-shadow:0 0 10px #ff8c00}
.box p{color:#aaa;font-size:14px}
button#btnLogin{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:15px;display:flex;justify-content:center;align-items:center;gap:8px;transition:0.2s}
button#btnLogin:hover{transform:scale(1.05);box-shadow:0 0 15px #fff}
#error{color:#ff4444;font-size:13px;margin-top:10px;min-height:15px}

/* NAGA BERJALAN */
.dragon-track{position:fixed;bottom:0;left:0;width:100%;height:100px;pointer-events:none;z-index:5;overflow:hidden}
.dragon{position:absolute;bottom:15px;left:-250px;font-size:75px;animation:walkDragon 14s linear infinite;filter:drop-shadow(0 0 10px #ff4500)}
.dragon::after{content:'🔥';position:absolute;left:-25px;top:20px;font-size:25px;animation:fire 0.3s infinite alternate}
@keyframes walkDragon{
0%{left:-250px;transform:scaleX(1)}
45%{transform:scaleX(1)}
50%{left:110%;transform:scaleX(-1)}
95%{transform:scaleX(-1)}
100%{left:-250px;transform:scaleX(1)}
}
@keyframes fire{0%{transform:scale(1) translateX(0)}100%{transform:scale(1.3) translateX(-5px)}}
.ground{position:fixed;bottom:0;left:0;width:100%;height:35px;background:linear-gradient(#222,#000);border-top:2px solid #333}
.footprint{position:absolute;bottom:35px;font-size:12px;opacity:0.3;animation:fadePrint 3s forwards}
@keyframes fadePrint{0%{opacity:0.3}100%{opacity:0}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="ground"></div>
<div class="dragon-track"><div class="dragon" id="dragon">🐉</div></div>

<div class="box">
<h1>FAREL FLIX</h1>
<p>Login untuk nonton film</p>
<button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
<div id="error"></div>
<p style="margin-top:15px;font-size:11px;color:#666">🐾 Naga penjaga sedang berpatroli...</p>
</div>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

onAuthStateChanged(auth, (u)=>{ if(u) location.href="index.html"; });

document.getElementById("btnLogin").onclick = async()=>{
  const err = document.getElementById("error");
  err.innerText = "Loading...";
  try{ await signInWithPopup(auth, provider); location.href="index.html"; }
  catch(e){ err.innerText = e.message; }
};

// BIKIN BINTANG
const starsBox = document.getElementById("stars");
for(let i=0;i<80;i++){let s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*2+"s";starsBox.appendChild(s);}

// JEJAK KAKI NAGA
setInterval(()=>{
  let d = document.getElementById("dragon");
  let rect = d.getBoundingClientRect();
  if(rect.left>0 && rect.left < window.innerWidth - 50){
    let fp = document.createElement("div");
    fp.className="footprint";fp.innerText="🐾";
    fp.style.left = (rect.left+40)+"px";
    document.body.appendChild(fp);
    setTimeout(()=>fp.remove(),3000);
  }
},400);
</script>
</body>
</html>
