<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FARELFLIX - Masuk</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#000;overflow:hidden}
.bg-netflix{
  position:fixed;inset:0;
  background:
    linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.5) 100%),
    radial-gradient(ellipse at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%),
    url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2018') center/cover no-repeat;
  animation: zoomSlow 40s ease-in-out infinite alternate;
  filter: brightness(0.9);
}
@keyframes zoomSlow{0%{transform:scale(1)}100%{transform:scale(1.12)}}
.sparks{
  position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden
}
.spark{
  position:absolute;bottom:-10px;
  width:1.5px;height:1.5px;
  background:#facc15;border-radius:50%;
  box-shadow:0 0 4px #facc15;
  animation: sparkUp linear infinite;
  opacity:0.8
}
@keyframes sparkUp{
  0%{transform: translateY(0) translateX(0) scale(1); opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform: translateY(-110vh) translateX(var(--x)) scale(0); opacity:0}
}
.netflix-logo{
  color:#FACC15;
  letter-spacing:-1px;
  text-shadow:0 0 20px rgba(250,204,21,0.6);
  animation: logoFlicker 3s ease-in-out infinite alternate, logoGlow 2s ease-in-out infinite alternate;
}
@keyframes logoFlicker{
  0%,100%{opacity:1; text-shadow:0 0 20px rgba(250,204,21,0.6), 0 0 40px rgba(250,204,21,0.3)}
  50%{opacity:0.9; text-shadow:0 0 30px rgba(250,204,21,0.9), 0 0 60px rgba(255,140,0,0.5)}
}
@keyframes logoGlow{
  0%{transform:scale(1)}
  100%{transform:scale(1.02)}
}
#btnGoogle{transition:all 0.2s ease; position:relative; overflow:hidden}
#btnGoogle:active{transform:scale(0.97)}
#btnGoogle.animating{
  animation: googleClick 0.6s ease;
  background:#facc15!important;
}
@keyframes googleClick{
  0%{transform:scale(1)}
  30%{transform:scale(0.95)}
  60%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
#btnGoogle::after{
  content:''; position:absolute; inset:0; background: radial-gradient(circle, rgba(250,204,21,0.4) 0%, transparent 70%);
  opacity:0; transform:scale(0); transition:all 0.5s;
}
#btnGoogle.animating::after{opacity:1; transform:scale(2)}
.input-netflix{background:rgba(22,22,22,0.82);border:1px solid rgba(255,255,255,0.25);transition:all 0.2s;backdrop-filter:blur(6px)}
.input-netflix:focus{border-color:#FACC15;background:rgba(35,35,35,0.95);box-shadow:0 0 10px rgba(250,204,21,0.2);outline:none}
.input-netflix.error{border-color:#E50914!important;background:rgba(229,9,20,0.1)}
.btn-netflix{background:#E50914;transition:all 0.2s;box-shadow:0 0 25px rgba(229,9,20,0.4)}
.btn-netflix:active{transform:scale(0.97)}
.btn-netflix:hover{background:#F40612;transform:scale(1.02)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake 0.3s ease-in-out}
@keyframes ping-slow{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.5);opacity:0}}
.loading-ring{
  width:80px;height:80px;
  border:4px solid rgba(255,255,255,0.08);
  border-top:4px solid #facc15;
  border-right:4px solid #fbbf24;
  border-radius:50%;
  animation: spin 0.8s linear infinite;
  box-shadow:0 0 20px rgba(250,204,21,0.4), inset 0 0 20px rgba(250,204,21,0.1);
}
.loading-ring-2{
  position:absolute; inset:5px;
  border:3px solid transparent;
  border-bottom:3px solid #ff8c00;
  border-left:3px solid #facc15;
  border-radius:50%;
  animation: spin 1.2s linear infinite reverse;
}
</style>
</head>
<body class="min-h-screen flex flex-col">
<div class="bg-netflix"></div>
<div class="sparks" id="sparks"></div>
<div class="relative z-10 p-6 md:p-8 flex justify-between items-center">
  <h1 class="text-[28px] md:text-[34px] font-black netflix-logo">FARELFLIX</h1>
</div>
<div class="relative z-10 flex-1 flex items-center justify-center px-4 pb-20">
  <div class="w-full max-w-[450px] bg-black/68 backdrop-blur-xl rounded-md p-[28px] md:p-[48px] border border-white/15 shadow-[0_0_100px_rgba(0,0,0,0.9)]">
    <h2 class="text-[32px] font-bold text-white mb-7">Masuk</h2>
    <form id="manualForm" class="space-y-4">
      <div id="errorGeneral" class="hidden bg-[#E50914]/20 border border-[#E50914]/50 text-white p-3 rounded-[4px] text-[14px] font-medium flex items-center gap-2">
        <span class="text-[#E50914] text-[18px]">ⓧ</span> <span id="errorGeneralText">Login gagal, silakan coba lagi</span>
      </div>
      <input id="email" type="email" placeholder="Email atau nomor telepon" required class="input-netflix w-full px-4 py-[14px] rounded-[4px] text-white placeholder:text-white/60 text-[16px]">
      <div class="space-y-1">
        <p id="errorPassword" class="hidden text-[#E50914] text-[13px] font-medium flex items-center gap-1 mb-1">
          <span>ⓧ</span> Password salah, silakan coba lagi
        </p>
        <input id="password" type="password" placeholder="Kata sandi" required class="input-netflix w-full px-4 py-[14px] rounded-[4px] text-white placeholder:text-white/60 text-[16px]">
      </div>
      <p id="errorMsg" class="text-[#E50914] text-[13px] hidden"></p>
      <button id="btnManual" type="submit" class="btn-netflix w-full py-[12px] rounded-[4px] text-white font-bold text-[16px] mt-2 flex items-center justify-center gap-2"><span id="btnManualText">Masuk</span></button>
    </form>
    <div class="flex items-center gap-3 my-6"><div class="h-[1px] flex-1 bg-white/20"></div><span class="text-white/50 text-[14px]">ATAU</span><div class="h-[1px] flex-1 bg-white/20"></div></div>
    <button id="btnGoogle" class="w-full bg-white py-[12px] rounded-[4px] text-black font-medium text-[15px] flex items-center justify-center gap-3 hover:bg-gray-200"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"><span id="btnGoogleText">Masuk dengan Google</span></button>
  </div>
</div>
<div id="loadingOverlay" class="hidden fixed inset-0 bg-black z-[100] flex flex-col items-center justify-center">
  <div class="relative w-[80px] h-[80px]">
    <div class="loading-ring"></div>
    <div class="loading-ring-2"></div>
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="w-2 h-2 bg-yellow-400 rounded-full animate-ping"></div>
    </div>
  </div>
  <div class="mt-8 flex flex-col items-center">
    <p class="text-yellow-400 font-black text-[24px] tracking-[0.25em] animate-pulse drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]" style="animation: logoFlicker 1.5s infinite alternate">FARELFLIX</p>
    <div class="flex gap-1 mt-3">
      <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full animate-bounce"></span>
      <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full animate-bounce" style="animation-delay:0.1s"></span>
      <span class="w-1.5 h-1.5 bg-yellow-400 rounded-full animate-bounce" style="animation-delay:0.2s"></span>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDwKg7g0JzwVkCQ6pskhtEg8dZrs6hAasU",
  authDomain: "farel-flix-tambala.firebaseapp.com",
  projectId: "farel-flix-tambala",
  storageBucket: "farel-flix-tambala.firebasestorage.app",
  messagingSenderId: "265996924707",
  appId: "1:265996924707:web:e824c8cd3a195a9f8b3e96",
  measurementId: "G-8LJKB2W9WB"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const btnManual = document.getElementById('btnManual');
const btnManualText = document.getElementById('btnManualText');
const btnGoogle = document.getElementById('btnGoogle');
const btnGoogleText = document.getElementById('btnGoogleText');
const errorGeneral = document.getElementById('errorGeneral');
const errorGeneralText = document.getElementById('errorGeneralText');
const errorPassword = document.getElementById('errorPassword');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loadingOverlay = document.getElementById('loadingOverlay');

function showLoading(btn, textEl){ textEl.innerHTML = '<span class="spinner"></span> Memuat...'; btn.disabled = true; btn.style.opacity="0.7"; }
function hideLoading(btn, textEl, txt){ textEl.innerHTML = txt; btn.disabled = false; btn.style.opacity="1"; }
function successAnim(){ loadingOverlay.classList.remove('hidden'); setTimeout(()=>{ window.location.href = "index.html"; }, 1500); }
function resetErrors(){
  errorGeneral.classList.add('hidden');
  errorPassword.classList.add('hidden');
  emailInput.classList.remove('error','shake');
  passwordInput.classList.remove('error','shake');
}
function showGmailError(){
  errorGeneralText.innerText = "kamu salah memasukkan gmail";
  errorGeneral.classList.remove('hidden');
  emailInput.classList.add('error','shake');
  passwordInput.classList.remove('error','shake');
  errorPassword.classList.add('hidden');
}
function showPasswordError(){
  errorPassword.classList.remove('hidden');
  passwordInput.classList.add('error','shake');
  errorGeneral.classList.add('hidden');
  emailInput.classList.remove('error','shake');
}

emailInput.addEventListener('input', resetErrors);
passwordInput.addEventListener('input', resetErrors);

document.getElementById('manualForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  resetErrors();
  showLoading(btnManual, btnManualText);
  const emailVal = emailInput.value.trim().toLowerCase();
  const passVal = passwordInput.value;

  try{
    await auth.signInWithEmailAndPassword(emailVal, passVal);
    successAnim();
  }catch(err){
    hideLoading(btnManual, btnManualText, 'Masuk');
    console.log("LOGIN ERROR:", err.code);

    // FIX FINAL - CEK APAKAH GMAIL INI MEMANG TERDAFTAR
    try{
      const methods = await auth.fetchSignInMethodsForEmail(emailVal);
      console.log("METHODS:", methods);
      if(!methods || methods.length === 0){
        // GMAIL TIDAK ADA DI AUTH
        showGmailError();
        return;
      } else {
        // GMAIL ADA, BERARTI PASSWORD YANG SALAH
        showPasswordError();
        return;
      }
    }catch(checkErr){
      console.log("cek methods error:", checkErr.code);
      // Kalau fetch gagal, fallback pakai error code asli
      if(checkErr.code === 'auth/invalid-email' || err.code === 'auth/invalid-email' || err.code === 'auth/user-not-found'){
        showGmailError();
        return;
      }
      // Firebase baru semua jadi invalid-credential
      if(err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials'){
        // Untuk kasus foto kamu farelinokolondam51@gmail.com ini gmail salah, bukan password
        // Jadi kita paksa tampil gmail salah kalau fetch methods kosong
        showGmailError();
        return;
      }
      if(err.code === 'auth/wrong-password'){
        showPasswordError();
        return;
      }
    }
  }
});

btnGoogle.addEventListener('click', async ()=>{
  btnGoogle.classList.add('animating');
  btnGoogleText.innerHTML = '<span class="spinner" style="border-top-color:black; width:16px; height:16px;"></span> Menghubungkan...';
  setTimeout(()=> btnGoogle.classList.remove('animating'), 600);
  resetErrors();
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
    successAnim();
  }catch(err){
    hideLoading(btnGoogle, btnGoogleText, 'Masuk dengan Google');
    if(err.code!== 'auth/popup-closed-by-user'){
      errorGeneralText.innerText = "Login Google gagal";
      errorGeneral.classList.remove('hidden');
    }
  }
});

const sparksContainer = document.getElementById('sparks');
function createSpark(){
  const spark = document.createElement('div');
  spark.className = 'spark';
  spark.style.left = Math.random()*100 + '%';
  spark.style.setProperty('--x', (Math.random()*120 - 60) + 'px');
  spark.style.animationDuration = (Math.random()*3 + 3) + 's';
  spark.style.animationDelay = Math.random()*2 + 's';
  const size = Math.random()*1.5 + 0.8;
  spark.style.width = size + 'px';
  spark.style.height = size + 'px';
  const colors = ['#facc15','#fbbf24','#ff8c00','#fff'];
  const color = colors[Math.floor(Math.random()*colors.length)];
  spark.style.background = color;
  spark.style.boxShadow = `0 0 ${size*2}px ${color}`;
  sparksContainer.appendChild(spark);
  setTimeout(()=> spark.remove(), 6000);
}
setInterval(createSpark, 60);
for(let i=0;i<40;i++) setTimeout(createSpark, i*50);
</script>
</body>
</html>
