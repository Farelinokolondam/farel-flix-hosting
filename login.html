<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX - NAGA GEDE MELINGKAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;height:100vh;overflow:hidden;font-family:Arial;display:flex;justify-content:center;align-items:center}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(at center,#1f1600,#000 80%);z-index:1}

/* NAGA GEDE - 2X LEBIH BESAR */
.dragon-wrap{position:relative;z-index:10;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;pointer-events:none}
.dragon-img{
  position:absolute;
  width:880px; /* GEDE BANGET */
  height:880px;
  object-fit:contain;
  z-index:2;
  /* INI KUNCI BIAR BACKGROUND PUTIH HILANG */
  mix-blend-mode:screen;
  filter:drop-shadow(0 0 30px gold) drop-shadow(0 0 80px #ff4400) brightness(1.2) contrast(1.2);
  animation:napas 3s ease-in-out infinite;
}
@keyframes napas{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* API TENGAH DARI MULUT NAGA */
.api{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:20px;height:320px;z-index:3;pointer-events:none;margin-top:-40px}
.api-inner{width:100%;height:100%;background:linear-gradient(to bottom,#ffffcc 0%,#ffcc00 20%,#ff6600 50%,#ff0000 80%,transparent 100%);filter:blur(1px);border-radius:50%;animation:apiMenyala 0.15s infinite alternate;box-shadow:0 0 40px #ff4400,0 0 80px gold}
@keyframes apiMenyala{0%{opacity:0.9;transform:scaleX(1)}100%{opacity:1;transform:scaleX(2.2)}}

/* BOX DI TENGAH LINGKARAN NAGA */
.box{position:absolute;z-index:10;background:rgba(10,8,5,0.94);padding:32px 30px;border-radius:20px;width:360px;text-align:center;border:2px solid #ffcc0066;box-shadow:0 0 60px rgba(255,200,0,0.7), inset 0 0 30px rgba(255,200,0,0.2);backdrop-filter:blur(12px);pointer-events:auto}
.box h1{color:#ffcc00;margin:0;font-size:30px;letter-spacing:3px;text-shadow:0 0 20px gold}
.box p{color:#cc9900;font-size:12px;margin-top:4px}
#btnLogin{width:100%;padding:13px;background:linear-gradient(90deg,#ffcc00,#ff8800);color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:18px;display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 0 25px gold}
#btnLogin:hover{transform:scale(1.05)}
#error{color:#ff4444;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div id="bg"></div>

<div class="dragon-wrap">
  <!-- 1 NAGA BESAR DOANG -->
  <img class="dragon-img" src="naga-melingkar.png" alt="naga">
  <div class="api"><div class="api-inner"></div></div>
  
  <div class="box">
    <h1>FAREL FLIX</h1>
    <p>🐉 Naga Emas Penjaga 🐉</p>
    <button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
    <div id="error"></div>
    <p style="font-size:9px;color:#ffaa00;margin-top:12px;letter-spacing:3px">MASUK KE SARANG NAGA</p>
  </div>
</div>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Loading...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};
</script>
</body>
</html>
