<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FAREL FLIX DRAGON WAR 3D</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
#canvas3d{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,20,0.85);padding:35px;border-radius:20px;text-align:center;width:360px;border:1px solid #ff450066;box-shadow:0 0 50px rgba(255,69,0,0.6);z-index:10;backdrop-filter:blur(15px)}
.box h1{color:#ff8c00;margin:0;letter-spacing:3px;font-size:32px;text-shadow:0 0 20px #ff0000}
.box p{color:#aaa;font-size:13px}
#btnLogin{width:100%;padding:13px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:15px;display:flex;justify-content:center;align-items:center;gap:8px}
#btnLogin:hover{transform:scale(1.05);box-shadow:0 0 20px #fff}
#error{color:#ff4444;font-size:12px;margin-top:10px}
.badge{margin-top:10px;font-size:11px;color:#ff8c00;letter-spacing:2px;animation:blink 1s infinite alternate}
@keyframes blink{from{opacity:0.5}to{opacity:1}}
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div class="box">
<h1>FAREL FLIX</h1>
<p>🔥 DRAGON WAR 3D 🔥</p>
<button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Login dengan Google</button>
<div id="error"></div>
<div class="badge">⚔️ 2 NAGA SEDANG BERTARUNG ⚔️</div>
</div>

<script type="module">
import * as THREE from 'three';
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,(u)=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Loading...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};

// --- 3D SETUP ---
const canvas=document.getElementById('canvas3d');
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x02020a, 10, 50);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,2,14);
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);

// lights
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const light1=new THREE.PointLight(0xff4400, 3, 20); light1.position.set(-5,5,5); scene.add(light1);
const light2=new THREE.PointLight(0x0044ff, 3, 20); light2.position.set(5,5,5); scene.add(light2);

// dragon builder - low poly 3D dragon
function createDragon(color1, color2){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:color1, roughness:0.6});
  const mat2=new THREE.MeshStandardMaterial({color:color2, roughness:0.5});

  // body
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,1.5,4,8), mat);
  body.rotation.z=Math.PI/2; g.add(body);
  // head
  const head=new THREE.Mesh(new THREE.ConeGeometry(0.35,0.9,8), mat);
  head.position.set(1.1,0.2,0); head.rotation.z=-Math.PI/2; g.add(head);
  // eyes
  const eye=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6), new THREE.MeshStandardMaterial({color:0xffff00, emissive:0xff0000}));
  eye.position.set(1.2,0.35,0.15); g.add(eye);
  const eye2=eye.clone(); eye2.position.z=-0.15; g.add(eye2);
  // wings
  const wingGeo=new THREE.BufferGeometry();
  wingGeo.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0, 0,1.2,0, -1.2,0.3,0],3));
  const wing1=new THREE.Mesh(wingGeo, mat2); wing1.position.set(0,0.3); wing1.rotation.y=0.3; g.add(wing1);
  const wing2=wing1.clone(); wing2.position.z=-0.3; wing2.rotation.y=-0.3; g.add(wing2);
  // tail
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.15,1.2,6), mat2);
  tail.position.set(-1.2,0,0); tail.rotation.z=Math.PI/2; g.add(tail);
  // spikes
  for(let i=0;i<4;i++){const sp=new THREE.Mesh(new THREE.ConeGeometry(0.08,0.25,4), mat2); sp.position.set(0.3-i*0.3,0.4,0); g.add(sp);}
  return g;
}

const dragonA=createDragon(0xcc2200, 0x661100); // merah
const dragonB=createDragon(0x2244cc, 0x001166); // biru
scene.add(dragonA); scene.add(dragonB);

// fire particles
const fireParticles=[];
function spawnFire(pos, dir, color){
  for(let i=0;i<6;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4), new THREE.MeshBasicMaterial({color:color}));
    p.position.copy(pos); p.userData={vel:dir.clone().add(new THREE.Vector3((Math.random()-0.5)*0.2,(Math.random()-0.5)*0.2,0)), life:1}; scene.add(p); fireParticles.push(p);
  }
}

// stars
const starGeo=new THREE.BufferGeometry(); const starPos=[];
for(let i=0;i<300;i++) starPos.push((Math.random()-0.5)*60, (Math.random()-0.5)*40, (Math.random()-0.5)*20 -15);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:0.15}));
scene.add(stars);

// anim
let t=0;
function animate(){
  requestAnimationFrame(animate); t+=0.02;
  const time=Date.now()*0.001;

  // battle circular motion
  const radius=5 + Math.sin(t*0.5)*1.5;
  const angleA=t*0.6;
  const angleB=angleA+Math.PI;

  dragonA.position.set(Math.cos(angleA)*radius, 2+Math.sin(time*2)*1.2, Math.sin(angleA)*2);
  dragonB.position.set(Math.cos(angleB)*radius, 2.5+Math.cos(time*2)*1.0, Math.sin(angleB)*2);

  dragonA.lookAt(0,2,0); dragonA.rotation.y+=Math.PI;
  dragonB.lookAt(0,2,0);

  // wing flap
  dragonA.children[3].rotation.z=Math.sin(time*10)*0.8;
  dragonA.children[4].rotation.z=-Math.sin(time*10)*0.8;
  dragonB.children[3].rotation.z=Math.sin(time*10+1)*0.8;
  dragonB.children[4].rotation.z=-Math.sin(time*10+1)*0.8;

  // when close, shoot fire
  const dist=dragonA.position.distanceTo(dragonB.position);
  if(dist<6 && Math.random()<0.08){
    const mid=new THREE.Vector3().addVectors(dragonA.position, dragonB.position).multiplyScalar(0.5);
    const dirA=new THREE.Vector3().subVectors(mid, dragonA.position).normalize().multiplyScalar(0.25);
    const dirB=new THREE.Vector3().subVectors(mid, dragonB.position).normalize().multiplyScalar(0.25);
    spawnFire(dragonA.position.clone().add(new THREE.Vector3(1,0,0)), dirA, 0xff5500);
    spawnFire(dragonB.position.clone().add(new THREE.Vector3(-1,0,0)), dirB, 0x00aaff);
    if(dist<3.5 && Math.random()<0.2){
      // explosion flash
      light1.intensity=10; light2.intensity=10;
      setTimeout(()=>{light1.intensity=3; light2.intensity=3;},100);
    }
  }

  // update fire
  for(let i=fireParticles.length-1;i>=0;i--){
    const p=fireParticles[i]; p.position.add(p.userData.vel); p.userData.life-=0.02; p.scale.setScalar(p.userData.life);
    if(p.userData.life<=0){scene.remove(p); fireParticles.splice(i,1);}
  }

  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
