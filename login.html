<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX - NETFLIX MODE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#000;font-family: 'Segoe UI',Arial;display:flex;justify-content:center;align-items:center}

/* BACKGROUND NETFLIX ANIMASI */
.bg{position:fixed;inset:0;z-index:1;background:
  radial-gradient(ellipse at 20% 50%, rgba(229,9,20,0.25) 0%, transparent 50%),
  radial-gradient(ellipse at 80% 80%, rgba(255,140,0,0.15) 0%, transparent 50%),
  linear-gradient(180deg,#0a0a0a 0%,#000 100%)}
.bg::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, transparent, transparent 100px, rgba(255,255,255,0.02) 100px, rgba(255,255,255,0.02) 101px);
  animation:moveLines 20s linear infinite;
}
@keyframes moveLines{0%{transform:translateX(0)}100%{transform:translateX(-200px)}}

/* PARTIKEL API TERBANG ALA NETFLIX INTRO */
.particles{position:fixed;inset:0;z-index:2;pointer-events:none}
.p{position:absolute;width:3px;height:3px;background:#ff3300;border-radius:50%;box-shadow:0 0 10px #ff3300,0 0 20px #ff8800;animation:naik linear infinite}
@keyframes naik{
  0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-10vh) translateX(100px) scale(1.5);opacity:0}
}

/* SPOTLIGHT BERGERAK */
.spot{position:fixed;width:600px;height:600px;background:radial-gradient(circle, rgba(229,9,20,0.15) 0%, transparent 70%);z-index:3;pointer-events:none;animation:spotMove 8s ease-in-out infinite;filter:blur(20px)}
@keyframes spotMove{0%,100%{left:-10%;top:20%}50%{left:60%;top:40%}}

/* BOX LOGIN NETFLIX STYLE */
.box{
  position:relative;z-index:20;width:380px;padding:40px 32px;
  background:rgba(0,0,0,0.85);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;
  box-shadow:0 0 0 1px rgba(229,9,20,0.3), 0 20px 60px rgba(0,0,0,0.9), 0 0 80px rgba(229,9,20,0.15);
  animation:boxMuncul 0.8s ease-out;
  backdrop-filter:blur(20px);
}
@keyframes boxMuncul{0%{opacity:0;transform:translateY(30px) scale(0.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#e50914,#ff8c00,#e50914);
  background-size:200% 100%;
  animation:grad 3s linear infinite;
  border-radius:8px 8px 0 0;
}
@keyframes grad{0%{background-position:0%}100%{background-position:200%}}

.logo{font-size:36px;font-weight:900;letter-spacing:4px;color:#e50914;text-shadow:0 0 20px rgba(229,9,20,0.8),0 0 40px rgba(229,9,20,0.4);margin:0;text-align:center}
.logo span{color:#fff}
.subtitle{color:#999;font-size:12px;letter-spacing:3px;text-align:center;margin:8px 0 25px;text-transform:uppercase}

#btnLogin{
  width:100%;padding:14px;background:#e50914;color:#fff;border:none;border-radius:4px;
  font-weight:bold;font-size:15px;cursor:pointer;letter-spacing:0.5px;
  display:flex;justify-content:center;align-items:center;gap:10px;
  transition:0.2s;box-shadow:0 0 20px rgba(229,9,20,0.4);
}
#btnLogin:hover{background:#f40612;transform:scale(1.02);box-shadow:0 0 30px rgba(229,9,20,0.7)}
#btnLogin:active{transform:scale(0.98)}

.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#555;font-size:11px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}

.footer{margin-top:25px;text-align:center;color:#666;font-size:11px;line-height:1.6}
.footer b{color:#999}

#error{color:#e50914;font-size:12px;margin-top:12px;min-height:16px;text-align:center}
</style>
</head>
<body>
<div class="bg"></div>
<div class="spot"></div>
<div class="particles" id="particles"></div>

<div class="box">
  <h1 class="logo">FAREL<span>FLIX</span></h1>
  <p class="subtitle">Naga Emas Penjaga</p>
  
  <button id="btnLogin">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" style="background:#fff;border-radius:50%;padding:2px">
    Login dengan Google
  </button>
  
  <div id="error"></div>
  
  <div class="divider">MASUK KE SARANG NAGA</div>
  
  <div class="footer">
    <b>🎬 Streaming Premium</b><br>
    Login aman dengan naga penjaga<br>
    <span style="color:#e50914">●</span> Live • 4K • Dolby
  </div>
</div>

<script>
// Bikin 40 partikel api terbang
const cont=document.getElementById('particles');
for(let i=0;i<40;i++){
  const d=document.createElement('div'); d.className='p';
  d.style.left=Math.random()*100+'vw';
  d.style.animationDuration=(5+Math.random()*8)+'s';
  d.style.animationDelay=Math.random()*5+'s';
  d.style.width=(2+Math.random()*4)+'px';
  d.style.height=d.style.width;
  cont.appendChild(d);
}
</script>

<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Connecting...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};
</script>
</body>
</html>
