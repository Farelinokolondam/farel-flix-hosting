<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAREL FLIX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#000;font-family:'Segoe UI',Arial;display:flex;justify-content:center;align-items:center}
.bg{position:fixed;inset:0;z-index:1;background:radial-gradient(ellipse at 20% 50%, rgba(229,9,20,0.25) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(255,140,0,0.15) 0%, transparent 50%), linear-gradient(180deg,#0a0a0a 0%,#000 100%)}
.particles{position:fixed;inset:0;z-index:2;pointer-events:none}
.p{position:absolute;width:3px;height:3px;background:#ff3300;border-radius:50%;box-shadow:0 0 10px #ff3300;animation:naik linear infinite}
@keyframes naik{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}100%{transform:translateY(-10vh) translateX(100px);opacity:0}}
.box{position:relative;z-index:20;width:380px;padding:45px 32px;background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.1);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,0.9);backdrop-filter:blur(20px);text-align:center}
.box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#e50914;border-radius:8px 8px 0 0}
.logo{font-size:38px;font-weight:900;letter-spacing:4px;color:#e50914}
.logo span{color:#fff}
#btnLogin{width:100%;padding:14px;background:#e50914;color:#fff;border:none;border-radius:4px;font-weight:bold;font-size:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px;margin-top:40px}
#btnLogin:hover{background:#f40612}
#error{color:#e50914;font-size:12px;margin-top:12px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="particles" id="particles"></div>
<div class="box">
  <h1 class="logo">FAREL<span>FLIX</span></h1>
  <button id="btnLogin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" style="background:#fff;border-radius:50%;padding:2px"> Login dengan Google</button>
  <div id="error"></div>
</div>
<script>
for(let i=0;i<30;i++){const d=document.createElement('div');d.className='p';d.style.left=Math.random()*100+'vw';d.style.animationDuration=(5+Math.random()*8)+'s';d.style.animationDelay=Math.random()*5+'s';document.getElementById('particles').appendChild(d);}
</script>
<script type="module">
import { auth, provider } from "./firebase.js";
import { signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="index.html";});
document.getElementById("btnLogin").onclick=async()=>{
  document.getElementById("error").innerText="Connecting...";
  try{await signInWithPopup(auth,provider);location.href="index.html";}catch(e){document.getElementById("error").innerText=e.message;}
};
</script>
</body>
</html>
